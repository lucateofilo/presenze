  --border:  #1f1f1f;
  --muted:   #444;
  --soft:    #666;
  --text:    #fff;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}

/* ── HEADER ── */
header {
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
#btn-diary {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  color: var(--soft);
  transition: color 0.2s;
  line-height: 0;
}
#btn-diary:hover { color: var(--text); }
#btn-diary.active { color: var(--text); }

.diary-banner {
  margin-top: 16px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--soft);
  display: flex;
  align-items: center;
  gap: 10px;
}
.diary-banner-btn {
  background: none;
  border: none;
  color: var(--text);
  font-size: 12px;
  text-decoration: underline;
  cursor: pointer;
  padding: 0;
  white-space: nowrap;
}
#diary-nota {
  resize: vertical;
  height: 220px;
}

#btn-gear {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  color: var(--soft);
  transition: color 0.2s;
  line-height: 0;
}
#btn-gear:hover { color: var(--text); }
#btn-gear.active { color: var(--text); }

.hdr-title {
  font-size: 18px;
  letter-spacing: 6px;
  color: var(--muted);
  text-transform: uppercase;
}

.home-msg {
  font-size: 20px;
  color: var(--soft);
  text-align: center;
  margin-bottom: 32px;
  line-height: 1.4;
  min-height: 28px;
}

/* ── NAV ── */
nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  background: var(--bg);
  border-top: 1px solid var(--border);
  z-index: 50;
  max-width: 480px;
  margin: 0 auto;
  /* safe area per iPhone con home bar */
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1;
  padding: 18px;
  background: none;
  border: none;
  color: var(--soft);
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.2s;
  min-height: 58px;
}
nav button.active {
  color: var(--text);
  border-top: 1px solid var(--text);
  margin-top: -1px;
}

/* ── VIEWS ── */
.view { display: none; padding: 0 20px calc(90px + env(safe-area-inset-bottom)); }
.view.active { display: block; }

/* ── HOME ── */
#v-home {
  display: none;
  flex-direction: column;
  min-height: calc(100vh - 120px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
#v-home.active { display: flex; }

.home-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.home-bottom {
  padding-bottom: 16px;
  display: flex;
  justify-content: center;
}

#btn-main {
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--text);
  color: var(--text);
  font-size: 30px;
  font-weight: 300;
  letter-spacing: 5px;
  cursor: pointer;
  transition: all 0.15s;
  outline: none;
}
#btn-main:active { transform: scale(0.95); }
#btn-main.esci   { border-color: var(--muted); color: var(--muted); }


.in-corso-txt {
  margin-top: 16px;
  font-size: 12px;
  color: var(--soft);
  letter-spacing: 0.5px;
  min-height: 16px;
  text-align: center;
}

#btn-paga {
  display: block;
  margin: 0;
  padding: 14px 48px;
  background: none;
  border: 1px solid var(--border);
  color: var(--soft);
  font-size: 11px;
  letter-spacing: 3px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
}
#btn-paga:hover { border-color: var(--muted); color: var(--text); }

/* ── REGISTRO ── */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--border);
  margin-top: 24px;
  margin-bottom: 28px;
}
.stat {
  padding: 16px 8px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.stat:last-child { border-right: none; }
.stat-lbl {
  font-size: 10px;
  color: var(--soft);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.stat-val {
  font-size: 20px;
  font-weight: 300;
}

/* splash */
#splash {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: splashFade 0.8s ease 1.7s forwards;
}
#splash-heart {
  width: 80px;
  height: 80px;
  fill: var(--text);
  animation: heartGrow 1.7s cubic-bezier(0.2, 0, 0.6, 1) reverse forwards;
}
@keyframes heartGrow {
  0%   { transform: scale(0.1); opacity: 0; }
  15%  { opacity: 1; }
  100% { transform: scale(55); }
}
@keyframes splashFade {
  to { opacity: 0; pointer-events: none; }
}

/* totali pagato/non pagato */
.totali-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 28px;
}
.totale-box {
  text-align: center;
  border: 1px solid var(--border);
  padding: 16px 8px 0;
}
.totale-lbl {
  font-size: 9px;
  color: var(--soft);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.totale-ore {
  font-size: 28px;
  font-weight: 200;
  line-height: 1;
  letter-spacing: -1px;
}
.totale-eur {
  font-size: 12px;
  color: var(--soft);
  margin-top: 6px;
  letter-spacing: 0.5px;
}
.totale-bar-wrap {
  width: 100%;
  height: 4px;
  margin-top: 14px;
  background: var(--border);
}
.totale-bar { height: 100%; }
.totale-bar.green { background: #2a5c24; }
.totale-bar.red   { background: #5c2424; }

.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.cal-nav button {
  background: none;
  border: none;
  color: var(--soft);
  font-size: 22px;
  cursor: pointer;
  padding: 4px 14px;
  line-height: 1;
}
.cal-nav span { font-size: 13px; color: var(--muted); letter-spacing: 1px; }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.cal-hdr {
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  padding: 6px 0;
  letter-spacing: 1px;
}
.cal-cell {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  font-size: 12px;
  padding: 2px;
  cursor: default;
  transition: background 0.1s;
}
.cal-cell.today   { border-color: var(--muted); }
.cal-cell.has-data {
  background: #161616;
  border-color: var(--border);
  cursor: pointer;
}
.cal-cell.has-data:hover { background: #1e1e1e; }
.cal-cell.cal-day:not(.has-data):hover { background: #141414; }
.cal-day { touch-action: manipulation; }
.cal-cell .cn { font-size: 13px; }
.cal-cell .ch { font-size: 10px; color: var(--soft); margin-top: 2px; }
.cal-bar { display: flex; width: 100%; height: 3px; margin-top: 6px; border-radius: 1px; overflow: hidden; }
.cal-bar-g { background: #2a5c24; height: 100%; }
.cal-bar-r { background: #5c2424; height: 100%; }

#btn-diary-export {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 12px;
  background: none;
  border: 1px solid var(--border);
  color: var(--soft);
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
}
#btn-diary-export:hover { border-color: var(--muted); color: var(--text); }

#btn-export {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 12px;
  background: none;
  border: 1px solid var(--border);
  color: var(--soft);
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
}
#btn-export:hover { border-color: var(--muted); color: var(--text); }

/* ── OVERLAYS ── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.overlay.open { display: flex; }

.sheet {
  background: var(--surface);
  border-top: 1px solid var(--border);
  width: 100%;
  max-width: 480px;
  padding: 22px 20px calc(28px + env(safe-area-inset-bottom));
  max-height: 88vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.sheet-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.sheet-top h2 { font-size: 14px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; }
.btn-close {
  background: none;
  border: none;
  color: var(--soft);
  font-size: 24px;
  cursor: pointer;
  line-height: 1;
  padding: 0 2px;
}

/* form elements */
.fg { margin-bottom: 14px; }
.fg > label {
  display: block;
  font-size: 10px;
  color: var(--soft);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.fg input[type=time],
.fg input[type=number],
.fg textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px;
  font-size: 16px; /* min 16px evita zoom automatico su iOS */
  font-family: inherit;
  outline: none;
  border-radius: 0;
  -webkit-appearance: none;
}
.fg input:focus, .fg textarea:focus { border-color: var(--muted); }
.fg textarea { resize: none; height: 58px; }

.radio2 { display: flex; gap: 8px; }
.radio2 input[type=radio] { display: none; }
.radio2 label {
  flex: 1;
  border: 1px solid var(--border);
  color: var(--soft);
  text-align: center;
  padding: 10px 8px;
  font-size: 11px;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
  user-select: none;
}
.radio2 input:checked + label { border-color: var(--muted); color: var(--text); }

.check-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
}
.check-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--text); flex-shrink: 0; }
.check-row label { font-size: 12px; color: var(--soft); cursor: pointer; letter-spacing: 0.5px; }

.timb-card { border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; }
.timb-lbl  { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }


.btn-cta {
  width: 100%;
  padding: 14px;
  background: var(--text);
  color: var(--bg);
  border: none;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 20px;
  font-weight: 700;
  transition: background 0.15s;
}
.btn-cta:hover { background: #ddd; }

.btn-del {
  width: 100%;
  padding: 10px;
  background: none;
  border: 1px solid #2a2a2a;
  color: var(--soft);
  font-size: 11px;
  letter-spacing: 1px;
  cursor: pointer;
  margin-top: 8px;
  text-transform: uppercase;
  transition: all 0.15s;
}
.btn-del:hover { border-color: var(--muted); color: var(--text); }

.empty-note { font-size: 13px; color: var(--muted); padding: 10px 0; }

/* toast */
.toast {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom) + 12px);
  left: 50%; transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--soft);
  font-size: 13px;
  padding: 10px 18px;
  white-space: nowrap;
  z-index: 500;
  animation: toastIn 0.2s ease, toastOut 0.3s ease 2.7s forwards;
}
@keyframes toastIn  { from { opacity: 0; transform: translateX(-50%) translateY(8px); } }
@keyframes toastOut { to   { opacity: 0; } }


/* aggiungi timbratura */
.btn-add {
  width: 100%;
  padding: 12px;
  background: none;
  border: 1px dashed var(--border);
  color: var(--soft);
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  margin-top: 4px;
  transition: all 0.15s;
  text-transform: uppercase;
}
.btn-add:hover { border-color: var(--muted); color: var(--text); }


</style>
</head>

<script>
'use strict';

/* ── Storage ────────────────────────────────────── */
const REC_KEY = 'pr_records';
const STA_KEY = 'pr_stato';

function getRecs()      { return JSON.parse(localStorage.getItem(REC_KEY) || '[]'); }
function saveRecs(r)    { localStorage.setItem(REC_KEY, JSON.stringify(r)); }
function getStato()     { return JSON.parse(localStorage.getItem(STA_KEY) || 'null'); }
function saveStato(s)   { s == null ? localStorage.removeItem(STA_KEY) : localStorage.setItem(STA_KEY, JSON.stringify(s)); }

/* ── Utils ──────────────────────────────────────── */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function todayStr() { return new Date().toISOString().slice(0, 10); }

function tsToHM(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function hmToTs(dateStr, hm) {
  const [h, m] = hm.split(':').map(Number);
  const d = new Date(dateStr + 'T12:00:00');
  d.setHours(h, m, 0, 0);
  return d.getTime();
}

function recMin(r) {
  return (r.uscita_ts && r.entrata_ts) ? (r.uscita_ts - r.entrata_ts) / 60000 : 0;
}

function fmtH(min) {
  if (!min || min <= 0) return '—';
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  return m ? h + 'h' + String(m).padStart(2,'0') : h + 'h';
}

function mondayOf(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  return d.toISOString().slice(0, 10);
}

function sitoLabel(s) {
  return s === 'B' ? 'Sito' : s === 'N' ? 'Sede' : '';
}

const MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

function fmtDataIt(ds) {
  const d = new Date(ds + 'T12:00:00');
  const gg = ['Do','Lu','Ma','Me','Gi','Ve','Sa'][d.getDay()];
  return gg + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3);
}

/* ── Overlays ───────────────────────────────────── */
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function showToast(html) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = html;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3300);
}

let _undoRec = null, _undoTimer = null;
function undoDel() {
  if (!_undoRec) return;
  clearTimeout(_undoTimer);
  const all = getRecs();
  all.splice(_undoRec.idx, 0, _undoRec.rec);
  saveRecs(all);
  _undoRec = null;
  renderDayBody(currentDay);
  refreshStats();
  refreshCal();
}

document.querySelectorAll('.overlay').forEach(ov => {

});

});

/* ── Settings ──────────────────────────────────── */
const CFG_KEY = 'pr_cfg';
function getSettings() {
  return Object.assign({ metodo: 1, paga_giornata: 60, ore_soglia: 8, paga_ora_extra: 10 },
    JSON.parse(localStorage.getItem(CFG_KEY) || '{}'));
}
function saveSettings(cfg) { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }

function calcolaImportoGiornata(min, cfg) {
  cfg = cfg || getSettings();
  const sogl = cfg.ore_soglia * 60;
  return min <= sogl ? cfg.paga_giornata : cfg.paga_giornata + ((min - sogl) / 60) * cfg.paga_ora_extra;
}
function setBar(barId, pct) {
  document.getElementById(barId).style.width = (pct * 100).toFixed(1) + '%';
}

/* ── REGISTRO: stats ─────────────────────────────── */
function refreshStats() {
  const all = getRecs();
  const cfg = getSettings();
  const t   = todayStr();
  const mon = mondayOf(t);
  const ym  = t.slice(0, 7);
  const monTs = new Date(mon + 'T00:00:00').getTime();
  const sunTs = monTs + 7 * 86400000;
  const inSett = r => { const d = new Date(r.data + 'T12:00:00').getTime(); return d >= monTs && d < sunTs; };

  if (cfg.metodo === 1) {
    const sumMin = fn => all.filter(fn).reduce((a, r) => a + recMin(r), 0);
    document.getElementById('s-oggi').textContent = fmtH(sumMin(r => r.data === t));
    document.getElementById('s-sett').textContent = fmtH(sumMin(inSett));
    document.getElementById('s-mese').textContent = fmtH(sumMin(r => r.data.startsWith(ym)));
    const pag  = all.filter(r =>  r.pagato && r.uscita_ts);
    const npag = all.filter(r => !r.pagato && r.uscita_ts);
    const pagM = pag.reduce((a, r) => a + recMin(r), 0);
    const pagE = pag.reduce((a, r) => a + (r.importo || 0), 0);
    const npM  = npag.reduce((a, r) => a + recMin(r) - (r.ore_pagate || 0), 0);
    const pct  = (pagM + npM) > 0 ? pagM / (pagM + npM) : 0;
    document.getElementById('box1-lbl').textContent = 'Pagato';
    document.getElementById('box1-val').textContent = fmtH(pagM);
    document.getElementById('box1-sub').textContent = pagE > 0 ? '€ ' + pagE.toFixed(2) : '—';
    document.getElementById('box2-lbl').textContent = 'Da pagare';
    document.getElementById('box2-val').textContent = fmtH(npM);
    document.getElementById('box2-sub').textContent = '';
    setBar('box1-bar', pct);
    setBar('box2-bar', 1 - pct);
  } else {
    const compHas = r => r.uscita_ts > 0;
    const fmtGg = n => n > 0 ? n + ' gg' : '—';
    document.getElementById('s-oggi').textContent = fmtGg(all.filter(r => r.data === t && compHas(r)).length);
    document.getElementById('s-sett').textContent = fmtGg(all.filter(r => inSett(r) && compHas(r)).length);
    document.getElementById('s-mese').textContent = fmtGg(all.filter(r => r.data.startsWith(ym) && compHas(r)).length);
    const pag  = all.filter(r =>  r.pagato && r.uscita_ts);
    const npag = all.filter(r => !r.pagato && r.uscita_ts);
    const pagE = pag.reduce((a, r) => a + (r.importo || 0), 0);
    const npE  = npag.reduce((a, r) => a + calcolaImportoGiornata(recMin(r)), 0);
    const tot  = pag.length + npag.length;
    const pct  = tot > 0 ? pag.length / tot : 0;
    document.getElementById('box1-lbl').textContent = 'Giornate pagate';
    document.getElementById('box1-val').textContent = pag.length > 0 ? pag.length + ' gg' : '—';
    document.getElementById('box1-sub').textContent = pagE > 0 ? '€ ' + pagE.toFixed(2) : '—';
    document.getElementById('box2-lbl').textContent = 'Da pagare';
    document.getElementById('box2-val').textContent = npag.length > 0 ? npag.length + ' gg' : '—';
    document.getElementById('box2-sub').textContent = npE > 0 ? '~ € ' + npE.toFixed(2) : '';
    setBar('box1-bar', pct);
    setBar('box2-bar', 1 - pct);
  }
}


/* ── REGISTRO: calendario ───────────────────────── */
let calY, calM;
(function() { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); })();

function refreshCal() {
  document.getElementById('c-label').textContent = MONTHS[calM] + ' ' + calY;

  const all    = getRecs();
  const t      = todayStr();
  const prefix = calY + '-' + String(calM + 1).padStart(2, '0');
  const days   = new Date(calY, calM + 1, 0).getDate();
  let   offset = new Date(calY, calM, 1).getDay(); // 0=dom
  offset = offset === 0 ? 6 : offset - 1;          // 0=lun

  // ore per giorno (totali e pagate)
  const hMap = {}, hPagMap = {};
  all.forEach(r => {
    if (r.data.startsWith(prefix)) {
      const m = recMin(r);
      hMap[r.data]    = (hMap[r.data]    || 0) + m;
      hPagMap[r.data] = (hPagMap[r.data] || 0) + (r.pagato ? m : (r.ore_pagate || 0));
    }
  });

  const DNAMES = ['Lu','Ma','Me','Gi','Ve','Sa','Do'];
  let html = DNAMES.map(d => '<div class="cal-hdr">' + d + '</div>').join('');
  for (let i = 0; i < offset; i++) html += '<div class="cal-cell"></div>';

  for (let d = 1; d <= days; d++) {
    const ds     = prefix + '-' + String(d).padStart(2, '0');
    const min    = hMap[ds] || 0;
    const minPag = hPagMap[ds] || 0;
    const cls    = ['cal-cell', 'cal-day', min > 0 && 'has-data', ds === t && 'today'].filter(Boolean).join(' ');
    let bar = '';
    if (min > 0) {
      const pct = Math.min(minPag / min, 1);
      bar = '<div class="cal-bar">'
          + '<div class="cal-bar-g" style="width:' + (pct * 100).toFixed(1) + '%"></div>'
          + '<div class="cal-bar-r" style="width:' + ((1 - pct) * 100).toFixed(1) + '%"></div>'
          + '</div>';
    }
    const special = ds.slice(5) === '05-11' ? '🌷' : ds.slice(8) === '23' ? '🤍' : '';
    html += '<div class="' + cls + '" style="cursor:pointer" onclick="openDay(\'' + ds + '\')">'
          + '<span class="cn">' + d + '</span>'
          + (special ? '<span style="font-size:10px;line-height:1">' + special + '</span>' : (min > 0 ? '<span class="ch">' + fmtH(min) + '</span>' : ''))
          + bar
          + '</div>';
  }

  document.getElementById('cal-grid').innerHTML = html;
}

document.getElementById('c-prev').addEventListener('click', () => {
  calM--; if (calM < 0) { calM = 11; calY--; } refreshCal();
});
document.getElementById('c-next').addEventListener('click', () => {
  calM++; if (calM > 11) { calM = 0; calY++; } refreshCal();
});

/* ── MODAL: giorno ──────────────────────────────── */
let currentDay = null;

function openDay(ds) {
  currentDay = ds;
  const d = new Date(ds + 'T12:00:00');
  document.getElementById('day-title').textContent = d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  renderDayBody(ds);
  openModal('ov-day');
}

function renderDayBody(ds) {
  const list = getRecs().filter(r => r.data === ds);

  const addBtn = '<button class="btn-add" onclick="addTimbratura(\'' + ds + '\')">+ Aggiungi timbratura</button>';

  if (!list.length) {
    document.getElementById('day-body').innerHTML = '<p class="empty-note">Nessuna timbratura per questo giorno.</p>' + addBtn;
    return;
  }

  const html = list.map((r, i) => {
    return '<div class="timb-card">'
      + '<div class="timb-lbl">Timbratura ' + (i + 1) + '</div>'

      + '<div class="fg"><label>Entrata</label>'
      + '<input type="time" value="' + r.entrata + '" onchange="patchRec(\'' + r.id + '\',\'entrata\',this.value)"></div>'

      + '<div class="fg"><label>Uscita</label>'
      + '<input type="time" value="' + (r.uscita || '') + '" onchange="patchRec(\'' + r.id + '\',\'uscita\',this.value)"></div>'

      + '<div class="fg"><label>Note</label>'
      + '<textarea onchange="patchRec(\'' + r.id + '\',\'nota\',this.value)">' + (r.nota || '') + '</textarea></div>'

      + '<div class="check-row">'
      + '<input type="checkbox" id="chk-' + r.id + '"' + (r.pagato ? ' checked' : '') + ' onchange="patchRec(\'' + r.id + '\',\'pagato\',this.checked)">'
      + '<label for="chk-' + r.id + '">PAGATO</label></div>'

      + (r.pagato
          ? '<div class="fg" style="margin-top:10px;"><label>Importo (€)</label>'
          + '<input type="number" step="0.01" min="0" value="' + (r.importo || 0) + '" onchange="patchRec(\'' + r.id + '\',\'importo\',parseFloat(this.value)||0)"></div>'
          : '')

      + '<button class="btn-del" onclick="delRec(\'' + r.id + '\')">Elimina timbratura</button>'
      + '</div>';
  }).join('');

  document.getElementById('day-body').innerHTML = html + addBtn;
}

function patchRec(id, field, value) {
  const all = getRecs();
  const r   = all.find(r => r.id === id);
  if (!r) return;
  r[field] = value;
  if (field === 'entrata') r.entrata_ts = hmToTs(r.data, value);
  if (field === 'uscita')  r.uscita_ts  = hmToTs(r.data, value);
  saveRecs(all);
  if (field === 'pagato') renderDayBody(currentDay); // mostra/nasconde campo importo
  refreshStats();
  refreshCal();
}

function delRec(id) {
  const all = getRecs();
  const idx = all.findIndex(r => r.id === id);
  if (idx === -1) return;
  _undoRec = { rec: all[idx], idx };
  clearTimeout(_undoTimer);
  _undoTimer = setTimeout(() => { _undoRec = null; }, 3200);
  all.splice(idx, 1);
  saveRecs(all);
  renderDayBody(currentDay);
  refreshStats();
  refreshCal();
  showToast('Eliminata &nbsp;·&nbsp; <span onclick="undoDel()" style="text-decoration:underline;cursor:pointer;color:var(--text)">ANNULLA</span>');
}

/* ── MODAL: paga ──────────────────────────────────── */
function buildPagaBody() {
  const cfg  = getSettings();
  const all  = getRecs();
  const npag = all.filter(r => !r.pagato && r.uscita_ts).sort((a, b) => a.entrata_ts - b.entrata_ts);
  const el   = document.getElementById('paga-body');

  if (cfg.metodo === 1) {
    const npM = all.filter(r => !r.pagato && r.uscita_ts).reduce((a, r) => a + recMin(r) - (r.ore_pagate || 0), 0);
    const ref = npM > 0 ? '<p style="font-size:13px;color:var(--soft);margin:0 0 16px">Non pagate: <strong style="color:var(--text)">' + fmtH(npM) + '</strong></p>' : '';
    el.innerHTML = ref +
      '<div class="fg"><label>Ore pagate</label><input type="number" id="p-ore" min="0" step="0.5"></div>' +
      '<div class="fg"><label>Importo € (opz.)</label><input type="number" id="p-imp" min="0" step="0.01"></div>';
  } else {
    let html = '<p style="font-size:13px;color:var(--soft);margin:0 0 12px">Seleziona le giornate da pagare (vuoto = tutte dal più vecchio)</p>';
    if (!npag.length) {
      html = '<p style="color:var(--soft);font-size:13px">Nessuna giornata da pagare.</p>';
    } else {
      npag.forEach(r => {
        const min = recMin(r);
        const imp = calcolaImportoGiornata(min);
        html += '<label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer">' +
          '<input type="checkbox" class="paga-chk" data-id="' + r.id + '" data-imp="' + imp.toFixed(2) + '">' +
          '<span style="flex:1"><span style="font-weight:600">' + fmtDataIt(r.data) + '</span>' +
          ' &nbsp; ' + (r.entrata || '') + '–' + (r.uscita || '') +
          ' &nbsp; <span style="color:var(--soft)">' + fmtH(min) + '</span></span>' +
          '<span style="color:var(--soft);font-size:13px">€ ' + imp.toFixed(2) + '</span>' +
          '</label>';
      });
    }
    el.innerHTML = html;
  }
}

document.getElementById('btn-paga').addEventListener('click', () => {
  buildPagaBody();
  openModal('ov-paga');
});

document.getElementById('btn-salva-paga').addEventListener('click', () => {
  const cfg = getSettings();
  const all = getRecs();

  if (cfg.metodo === 1) {
    const oreIn   = parseFloat(document.getElementById('p-ore').value) || 0;
    const importo = parseFloat(document.getElementById('p-imp').value) || 0;
    if (!oreIn) { alert('Inserisci le ore pagate.'); return; }
    let minRimasti = Math.round(oreIn * 60);
    const candidati = all.filter(r => !r.pagato && r.uscita_ts).sort((a, b) => a.entrata_ts - b.entrata_ts);
    const minTot = Math.min(minRimasti, candidati.reduce((a, r) => a + recMin(r) - (r.ore_pagate || 0), 0));
    for (const r of candidati) {
      if (minRimasti <= 0) break;
      const minDisp = recMin(r) - (r.ore_pagate || 0);
      const quota   = minTot > 0 ? (Math.min(minDisp, minRimasti) / minTot) * importo : 0;
      if (minRimasti >= minDisp) {
        r.pagato = true; r.importo = Math.round(quota * 100) / 100; delete r.ore_pagate; minRimasti -= minDisp;
      } else {
        r.ore_pagate = (r.ore_pagate || 0) + minRimasti; r.importo = Math.round(quota * 100) / 100; minRimasti = 0;
      }
    }
  } else {
    // Metodo 2: giornate
    const chks = [...document.querySelectorAll('.paga-chk:checked')];
    let candidati;
    if (chks.length) {
      const ids = new Set(chks.map(c => c.dataset.id));
      candidati = all.filter(r => ids.has(r.id));
    } else {
      // nessuna selezione: tutte dal più vecchio
      candidati = all.filter(r => !r.pagato && r.uscita_ts).sort((a, b) => a.entrata_ts - b.entrata_ts);
      if (!candidati.length) { closeModal('ov-paga'); return; }
      if (!confirm('Segna come pagate tutte le ' + candidati.length + ' giornate non pagate?')) return;
    }
    for (const r of candidati) {
      r.pagato  = true;
      r.importo = calcolaImportoGiornata(recMin(r));
    }
    saveRecs(all);
    closeModal('ov-paga');
    refreshStats();
    refreshCal();
    showToast(candidati.length + ' giornate segnate come pagate');
    return;
  }

  saveRecs(all);
  closeModal('ov-paga');
  refreshStats();
  refreshCal();
  showToast('Pagamento applicato');
});


/* ── DIARIO ─────────────────────────────────────── */
const DIARY_KEY   = 'pr_diary';
const DEXPORT_KEY = 'pr_diary_export';

function getDiary()      { return JSON.parse(localStorage.getItem(DIARY_KEY)   || '{}'); }
function saveDiary(d)    { localStorage.setItem(DIARY_KEY, JSON.stringify(d)); }

let dCalY, dCalM;
(function() { const n = new Date(); dCalY = n.getFullYear(); dCalM = n.getMonth(); })();

function checkDiaryBanner() {
  const diary   = getDiary();
  const hasData = Object.keys(diary).some(k => diary[k].trim());
  if (!hasData) { document.getElementById('diary-banner').style.display = 'none'; return; }
  const lastExp = parseInt(localStorage.getItem(DEXPORT_KEY) || '0');
  const days    = Math.floor((Date.now() - lastExp) / 86400000);
  const banner  = document.getElementById('diary-banner');
  if (!lastExp || days >= 7) {
    document.getElementById('diary-banner-txt').textContent =
      lastExp ? 'Backup consigliato — ultimo ' + days + ' giorni fa' : 'Nessun backup ancora — esporta il diario';
    banner.style.display = 'flex';
  } else {
    banner.style.display = 'none';
  }
}

function refreshDiaryCal() {
  document.getElementById('d-label').textContent = MONTHS[dCalM] + ' ' + dCalY;
  const diary  = getDiary();
  const t      = todayStr();
  const prefix = dCalY + '-' + String(dCalM + 1).padStart(2, '0');
  const days   = new Date(dCalY, dCalM + 1, 0).getDate();
  let offset   = new Date(dCalY, dCalM, 1).getDay();
  offset = offset === 0 ? 6 : offset - 1;

  const DNAMES = ['Lu','Ma','Me','Gi','Ve','Sa','Do'];
  let html = DNAMES.map(d => '<div class="cal-hdr">' + d + '</div>').join('');
  for (let i = 0; i < offset; i++) html += '<div class="cal-cell"></div>';

  for (let d = 1; d <= days; d++) {
    const ds  = prefix + '-' + String(d).padStart(2, '0');
    const txt = diary[ds] ? diary[ds].trim() : '';
    const cls = ['cal-cell', 'cal-day', txt && 'has-data', ds === t && 'today'].filter(Boolean).join(' ');
    const dSpecial = ds.slice(5) === '05-11' ? '🌷' : ds.slice(8) === '23' ? '🤍' : '';
    const dot = txt ? '<span style="width:4px;height:4px;border-radius:50%;background:var(--soft);margin-top:4px;display:block"></span>' : '';
    html += '<div class="' + cls + '" style="cursor:pointer" onclick="openDiaryDay('' + ds + '')">'
          + '<span class="cn">' + d + '</span>'
          + (dSpecial ? '<span style="font-size:10px;line-height:1">' + dSpecial + '</span>' : dot)
          + '</div>';
  }
  document.getElementById('diary-grid').innerHTML = html;
}

function openDiaryDay(ds) {
  const d = new Date(ds + 'T12:00:00');
  document.getElementById('diary-day-title').textContent = d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  document.getElementById('diary-nota').value = getDiary()[ds] || '';
  document.getElementById('btn-salva-diary-day').onclick = () => {
    const val = document.getElementById('diary-nota').value;
    const diary = getDiary();
    if (val.trim()) diary[ds] = val; else delete diary[ds];
    saveDiary(diary);
    closeModal('ov-diary-day');
    refreshDiaryCal();
  };
  openModal('ov-diary-day');
}

function withXLSX(cb) {
  if (window.XLSX) { cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js';
  s.onload = cb;
  s.onerror = () => alert('Impossibile caricare la libreria Excel. Controlla la connessione.');
  document.head.appendChild(s);
}

function exportAll() {
  withXLSX(() => {
  const all   = getRecs();
  const diary = getDiary();
  const wb    = XLSX.utils.book_new();

  // Foglio 1: Presenze
  const presRows = [...all]
    .sort((a, b) => a.data.localeCompare(b.data))
    .map(r => {
      const min = recMin(r);
      const h = Math.floor(min / 60), m = Math.round(min % 60);
      return {
        'Data':           r.data,
        'Entrata':        r.entrata || '',
        'Uscita':         r.uscita  || '',
        'Ore':            min ? h + ':' + String(m).padStart(2,'0') : '',
        'Ore (decimali)': min ? +(min / 60).toFixed(2) : '',
        'Nota':           r.nota    || '',
        'Pagato':         r.pagato  ? 'Sì' : 'No',
        'Importo €':      r.importo || ''
      };
    });
  const ws1 = XLSX.utils.json_to_sheet(presRows.length ? presRows : [{ 'Info': 'Nessuna presenza' }]);
  ws1['!cols'] = [12, 8, 8, 8, 14, 22, 8, 10].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws1, 'Presenze');

  // Foglio 2: Diario
  const diaryKeys  = Object.keys(diary).filter(k => diary[k].trim()).sort();
  const diaryRows  = diaryKeys.map(k => ({ 'Data': k, 'Note': diary[k] }));
  const ws2 = XLSX.utils.json_to_sheet(diaryRows.length ? diaryRows : [{ 'Info': 'Nessuna nota' }]);
  ws2['!cols'] = [{ wch: 12 }, { wch: 80 }];
  XLSX.utils.book_append_sheet(wb, ws2, 'Diario');

  XLSX.writeFile(wb, 'backup_' + todayStr() + '.xlsx');
  localStorage.setItem(DEXPORT_KEY, Date.now().toString());
  checkDiaryBanner();
  showToast('Backup esportato');
  });
}

document.getElementById('d-prev').addEventListener('click', () => {
  dCalM--; if (dCalM < 0) { dCalM = 11; dCalY--; } refreshDiaryCal();
});
document.getElementById('d-next').addEventListener('click', () => {
  dCalM++; if (dCalM > 11) { dCalM = 0; dCalY++; } refreshDiaryCal();
});
document.getElementById('btn-diary-export').addEventListener('click', exportAll);
document.getElementById('btn-export').addEventListener('click', exportAll);

/* ── Aggiungi timbratura manuale ────────────────── */
function addTimbratura(ds) {
  const body = document.getElementById('day-body');
  // sostituisce il bottone + con il form inline
  const form = body.querySelector('.timb-form');
  if (form) return; // già aperto
  const div = document.createElement('div');
  div.className = 'timb-form';
  div.innerHTML =
    '<div class="fg"><label>Entrata</label><input type="time" id="tf-in"></div>'
  + '<div class="fg"><label>Uscita</label><input type="time" id="tf-out"></div>'
  + '<button class="btn-cta" onclick="confirmTimbratura(\'' + ds + '\')">Conferma</button>'
  + '<button class="btn-del" onclick="renderDayBody(\'' + ds + '\')">Annulla</button>';
  body.querySelector('.btn-add').replaceWith(div);
}

function confirmTimbratura(ds) {
  const entrata = document.getElementById('tf-in').value;
  const uscita  = document.getElementById('tf-out').value;
  if (!entrata) { alert('Inserisci almeno l\'orario di entrata.'); return; }
  const all = getRecs();
  all.push({
    id: uid(), data: ds,
    entrata, uscita,
    entrata_ts: hmToTs(ds, entrata),
    uscita_ts:  uscita ? hmToTs(ds, uscita) : 0,
    sito: '', nota: '', pagato: false, importo: 0
  });
  saveRecs(all);
  renderDayBody(ds);
  refreshStats();
  refreshCal();
}

try { refreshHome(); } catch(e) { alert('ERR refreshHome: ' + e.message); }
try { refreshStats(); } catch(e) { alert('ERR refreshStats: ' + e.message); }
try { refreshCal(); } catch(e) { alert('ERR refreshCal: ' + e.message); }
setTimeout(() => { const s = document.getElementById('splash'); if(s) s.remove(); }, 2500);
