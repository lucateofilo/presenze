<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presenze">
<title>Presenze</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* evita pull-to-refresh e bounce accidentali */
html, body { overscroll-behavior: none; }

/* elimina highlight blu al tap */
* { -webkit-tap-highlight-color: transparent; }

/* elimina delay 300ms su tutti i bottoni e label */
button, label, a { touch-action: manipulation; }

:root {
  --bg:      #0d0d0d;
  --surface: #111;
  --border:  #1f1f1f;
  --muted:   #444;
  --soft:    #666;
  --text:    #fff;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}

/* ── HEADER ── */
header {
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px 14px;
  border-bottom: 1px solid var(--border);
  text-align: center;
}
.hdr-title {
  font-size: 18px;
  letter-spacing: 6px;
  color: var(--muted);
  text-transform: uppercase;
}

.home-msg {
  font-size: 20px;
  color: var(--soft);
  text-align: center;
  margin-bottom: 32px;
  line-height: 1.4;
  min-height: 28px;
}

/* ── NAV ── */
nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  background: var(--bg);
  border-top: 1px solid var(--border);
  z-index: 50;
  max-width: 480px;
  margin: 0 auto;
  /* safe area per iPhone con home bar */
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1;
  padding: 18px;
  background: none;
  border: none;
  color: var(--soft);
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.2s;
  min-height: 58px;
}
nav button.active {
  color: var(--text);
  border-top: 1px solid var(--text);
  margin-top: -1px;
}

/* ── VIEWS ── */
.view { display: none; padding: 0 20px calc(90px + env(safe-area-inset-bottom)); }
.view.active { display: block; }

/* ── HOME ── */
#v-home {
  display: none;
  flex-direction: column;
  min-height: calc(100vh - 120px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
#v-home.active { display: flex; }

.home-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.home-bottom {
  padding-bottom: 16px;
  display: flex;
  justify-content: center;
}

#btn-main {
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--text);
  color: var(--text);
  font-size: 30px;
  font-weight: 300;
  letter-spacing: 5px;
  cursor: pointer;
  transition: all 0.15s;
  outline: none;
}
#btn-main:active { transform: scale(0.95); }
#btn-main.esci   { border-color: var(--muted); color: var(--muted); }


.in-corso-txt {
  margin-top: 16px;
  font-size: 12px;
  color: var(--soft);
  letter-spacing: 0.5px;
  min-height: 16px;
  text-align: center;
}

#btn-paga {
  display: block;
  margin: 0;
  padding: 14px 48px;
  background: none;
  border: 1px solid var(--border);
  color: var(--soft);
  font-size: 11px;
  letter-spacing: 3px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
}
#btn-paga:hover { border-color: var(--muted); color: var(--text); }

/* ── REGISTRO ── */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--border);
  margin-top: 24px;
  margin-bottom: 28px;
}
.stat {
  padding: 16px 8px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.stat:last-child { border-right: none; }
.stat-lbl {
  font-size: 10px;
  color: var(--soft);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.stat-val {
  font-size: 20px;
  font-weight: 300;
}

/* splash */
#splash {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: splashFade 0.8s ease 1.7s forwards;
}
#splash-heart {
  width: 80px;
  height: 80px;
  fill: var(--text);
  animation: heartGrow 1.7s cubic-bezier(0.2, 0, 0.6, 1) reverse forwards;
}
@keyframes heartGrow {
  0%   { transform: scale(0.1); opacity: 0; }
  15%  { opacity: 1; }
  100% { transform: scale(55); }
}
@keyframes splashFade {
  to { opacity: 0; pointer-events: none; }
}

/* totali pagato/non pagato */
.totali-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 28px;
}
.totale-box {
  text-align: center;
  border: 1px solid var(--border);
  padding: 16px 8px 14px;
}
.totale-lbl {
  font-size: 9px;
  color: var(--soft);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.totale-ore {
  font-size: 28px;
  font-weight: 200;
  line-height: 1;
  letter-spacing: -1px;
}
.totale-eur {
  font-size: 12px;
  color: var(--soft);
  margin-top: 6px;
  letter-spacing: 0.5px;
}

.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.cal-nav button {
  background: none;
  border: none;
  color: var(--soft);
  font-size: 22px;
  cursor: pointer;
  padding: 4px 14px;
  line-height: 1;
}
.cal-nav span { font-size: 13px; color: var(--muted); letter-spacing: 1px; }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.cal-hdr {
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  padding: 6px 0;
  letter-spacing: 1px;
}
.cal-cell {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  font-size: 12px;
  padding: 2px;
  cursor: default;
  transition: background 0.1s;
}
.cal-cell.today   { border-color: var(--muted); }
.cal-cell.has-data {
  background: #161616;
  border-color: var(--border);
  cursor: pointer;
}
.cal-cell.has-data:hover { background: #1e1e1e; }
.cal-cell.cal-day:not(.has-data):hover { background: #141414; }
.cal-day { touch-action: manipulation; }
.cal-cell .cn { font-size: 13px; }
.cal-cell .ch { font-size: 10px; color: var(--soft); margin-top: 2px; }
.cal-bar { display: flex; width: 100%; height: 3px; margin-top: 6px; border-radius: 1px; overflow: hidden; }
.cal-bar-g { background: #2a5c24; height: 100%; }
.cal-bar-r { background: #5c2424; height: 100%; }

#btn-export {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 12px;
  background: none;
  border: 1px solid var(--border);
  color: var(--soft);
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
}
#btn-export:hover { border-color: var(--muted); color: var(--text); }

/* ── OVERLAYS ── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.overlay.open { display: flex; }

.sheet {
  background: var(--surface);
  border-top: 1px solid var(--border);
  width: 100%;
  max-width: 480px;
  padding: 22px 20px calc(28px + env(safe-area-inset-bottom));
  max-height: 88vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.sheet-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.sheet-top h2 { font-size: 14px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; }
.btn-close {
  background: none;
  border: none;
  color: var(--soft);
  font-size: 24px;
  cursor: pointer;
  line-height: 1;
  padding: 0 2px;
}

/* form elements */
.fg { margin-bottom: 14px; }
.fg > label {
  display: block;
  font-size: 10px;
  color: var(--soft);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.fg input[type=time],
.fg input[type=number],
.fg textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px;
  font-size: 16px; /* min 16px evita zoom automatico su iOS */
  font-family: inherit;
  outline: none;
  border-radius: 0;
  -webkit-appearance: none;
}
.fg input:focus, .fg textarea:focus { border-color: var(--muted); }
.fg textarea { resize: none; height: 58px; }

.radio2 { display: flex; gap: 8px; }
.radio2 input[type=radio] { display: none; }
.radio2 label {
  flex: 1;
  border: 1px solid var(--border);
  color: var(--soft);
  text-align: center;
  padding: 10px 8px;
  font-size: 11px;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
  user-select: none;
}
.radio2 input:checked + label { border-color: var(--muted); color: var(--text); }

.check-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
}
.check-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--text); flex-shrink: 0; }
.check-row label { font-size: 12px; color: var(--soft); cursor: pointer; letter-spacing: 0.5px; }

.timb-card { border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; }
.timb-lbl  { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }


.btn-cta {
  width: 100%;
  padding: 14px;
  background: var(--text);
  color: var(--bg);
  border: none;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 20px;
  font-weight: 700;
  transition: background 0.15s;
}
.btn-cta:hover { background: #ddd; }

.btn-del {
  width: 100%;
  padding: 10px;
  background: none;
  border: 1px solid #2a2a2a;
  color: var(--soft);
  font-size: 11px;
  letter-spacing: 1px;
  cursor: pointer;
  margin-top: 8px;
  text-transform: uppercase;
  transition: all 0.15s;
}
.btn-del:hover { border-color: var(--muted); color: var(--text); }

.empty-note { font-size: 13px; color: var(--muted); padding: 10px 0; }

/* toast */
.toast {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom) + 12px);
  left: 50%; transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--soft);
  font-size: 13px;
  padding: 10px 18px;
  white-space: nowrap;
  z-index: 500;
  animation: toastIn 0.2s ease, toastOut 0.3s ease 2.7s forwards;
}
@keyframes toastIn  { from { opacity: 0; transform: translateX(-50%) translateY(8px); } }
@keyframes toastOut { to   { opacity: 0; } }


/* aggiungi timbratura */
.btn-add {
  width: 100%;
  padding: 12px;
  background: none;
  border: 1px dashed var(--border);
  color: var(--soft);
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  margin-top: 4px;
  transition: all 0.15s;
  text-transform: uppercase;
}
.btn-add:hover { border-color: var(--muted); color: var(--text); }


</style>
</head>
<body>

<div id="splash">
  <svg id="splash-heart" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
  </svg>
</div>

<header>
  <div class="hdr-title">Presenze</div>
</header>

<!-- ── HOME ── -->
<div id="v-home" class="view active">
  <div class="home-center">
    <div class="home-msg" id="hdr-msg">Buon lavoro amore mio!🤍</div>
    <button id="btn-main">ENTRA</button>
    <div class="in-corso-txt" id="in-corso-txt"></div>
  </div>

  <div class="home-bottom">
    <button id="btn-paga">PAGA</button>
  </div>
</div>

<!-- ── REGISTRO ── -->
<div id="v-reg" class="view">
  <div class="stats">
    <div class="stat">
      <div class="stat-lbl">Oggi</div>
      <div class="stat-val" id="s-oggi">—</div>
    </div>
    <div class="stat">
      <div class="stat-lbl">Settimana</div>
      <div class="stat-val" id="s-sett">—</div>
    </div>
    <div class="stat">
      <div class="stat-lbl">Mese</div>
      <div class="stat-val" id="s-mese">—</div>
    </div>
  </div>

  <div class="totali-grid">
    <div class="totale-box">
      <div class="totale-lbl" id="box1-lbl">Pagato</div>
      <div class="totale-ore" id="box1-val">—</div>
      <div class="totale-eur" id="box1-sub">—</div>
      <div class="cal-bar"><div class="cal-bar-g" id="box1-bg" style="width:0%"></div><div class="cal-bar-r" id="box1-br" style="width:100%"></div></div>
    </div>
    <div class="totale-box">
      <div class="totale-lbl" id="box2-lbl">Da pagare</div>
      <div class="totale-ore" id="box2-val">—</div>
      <div class="totale-eur" id="box2-sub"></div>
      <div class="cal-bar"><div class="cal-bar-g" id="box2-bg" style="width:100%"></div><div class="cal-bar-r" id="box2-br" style="width:0%"></div></div>
    </div>
  </div>

  <div class="cal-nav">
    <button id="c-prev">‹</button>
    <span id="c-label"></span>
    <button id="c-next">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>

  <button id="btn-export">↓ Esporta Excel</button>
</div>

<nav>
  <button class="active" data-view="home">HOME</button>
  <button data-view="reg">REGISTRO</button>
  <button data-view="set">IMPOSTAZIONI</button>
</nav>

<!-- ── IMPOSTAZIONI ── -->
<div id="v-set" class="view">
  <div style="margin-top:24px;">
    <div class="fg">
      <label>Metodo di pagamento</label>
      <div class="radio2">
        <input type="radio" name="metodo" id="m-opt1" value="1">
        <label for="m-opt1">A ore</label>
        <input type="radio" name="metodo" id="m-opt2" value="2">
        <label for="m-opt2">A giornata</label>
      </div>
    </div>

    <div id="cfg-m2" style="display:none">
      <div class="fg"><label>€ per giornata (fino alla soglia)</label><input type="number" id="cfg-paga" step="0.01" min="0"></div>
      <div class="fg"><label>Ore soglia</label><input type="number" id="cfg-soglia" step="0.5" min="1"></div>
      <div class="fg"><label>€ per ora extra (oltre la soglia)</label><input type="number" id="cfg-extra" step="0.01" min="0"></div>
    </div>

    <button class="btn-cta" id="btn-salva-cfg">Salva impostazioni</button>
  </div>
</div>

<!-- ── MODAL: giorno ── -->
<div class="overlay" id="ov-day">
  <div class="sheet">
    <div class="sheet-top">
      <h2 id="day-title"></h2>
      <button class="btn-close" data-close="ov-day">×</button>
    </div>
    <div id="day-body"></div>
  </div>
</div>

<!-- ── MODAL: paga ── -->
<div class="overlay" id="ov-paga">
  <div class="sheet">
    <div class="sheet-top">
      <h2>Pagamento</h2>
      <button class="btn-close" data-close="ov-paga">×</button>
    </div>
    <div id="paga-body"></div>
    <button class="btn-cta" id="btn-salva-paga">Applica pagamento</button>
  </div>
</div>


<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script>
'use strict';

/* ── Storage ────────────────────────────────────── */
const REC_KEY = 'pr_records';
const STA_KEY = 'pr_stato';

function getRecs()      { return JSON.parse(localStorage.getItem(REC_KEY) || '[]'); }
function saveRecs(r)    { localStorage.setItem(REC_KEY, JSON.stringify(r)); }
function getStato()     { return JSON.parse(localStorage.getItem(STA_KEY) || 'null'); }
function saveStato(s)   { s == null ? localStorage.removeItem(STA_KEY) : localStorage.setItem(STA_KEY, JSON.stringify(s)); }

/* ── Utils ──────────────────────────────────────── */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function todayStr() { return new Date().toISOString().slice(0, 10); }

function tsToHM(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function hmToTs(dateStr, hm) {
  const [h, m] = hm.split(':').map(Number);
  const d = new Date(dateStr + 'T12:00:00');
  d.setHours(h, m, 0, 0);
  return d.getTime();
}

function recMin(r) {
  return (r.uscita_ts && r.entrata_ts) ? (r.uscita_ts - r.entrata_ts) / 60000 : 0;
}

function fmtH(min) {
  if (!min || min <= 0) return '—';
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  return m ? h + 'h' + String(m).padStart(2,'0') : h + 'h';
}

function mondayOf(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  return d.toISOString().slice(0, 10);
}

function sitoLabel(s) {
  return s === 'B' ? 'Sito' : s === 'N' ? 'Sede' : '';
}

const MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

function fmtDataIt(ds) {
  const d = new Date(ds + 'T12:00:00');
  const gg = ['Do','Lu','Ma','Me','Gi','Ve','Sa'][d.getDay()];
  return gg + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3);
}

/* ── Overlays ───────────────────────────────────── */
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function showToast(html) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = html;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3300);
}

let _undoRec = null, _undoTimer = null;
function undoDel() {
  if (!_undoRec) return;
  clearTimeout(_undoTimer);
  const all = getRecs();
  all.splice(_undoRec.idx, 0, _undoRec.rec);
  saveRecs(all);
  _undoRec = null;
  renderDayBody(currentDay);
  refreshStats();
  refreshCal();
}

document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); });
});
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close));
});

/* ── Nav ────────────────────────────────────────── */
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('v-' + btn.dataset.view).classList.add('active');
    if (btn.dataset.view === 'reg') { refreshStats(); refreshCal(); }
    if (btn.dataset.view === 'set') { initCfgForm(); }
  });
});


/* ── IMPOSTAZIONI ─────────────────────────────────── */
function initCfgForm() {
  const cfg = getSettings();
  document.querySelector('input[name="metodo"][value="' + cfg.metodo + '"]').checked = true;
  document.getElementById('cfg-paga').value   = cfg.paga_giornata;
  document.getElementById('cfg-soglia').value = cfg.ore_soglia;
  document.getElementById('cfg-extra').value  = cfg.paga_ora_extra;
  document.getElementById('cfg-m2').style.display = cfg.metodo === 2 ? '' : 'none';
}
document.querySelectorAll('input[name="metodo"]').forEach(r => {
  r.addEventListener('change', () => {
    document.getElementById('cfg-m2').style.display = r.value === '2' ? '' : 'none';
  });
});
document.getElementById('btn-salva-cfg').addEventListener('click', () => {
  const metodo = parseInt(document.querySelector('input[name="metodo"]:checked').value);
  saveSettings({
    metodo,
    paga_giornata:  parseFloat(document.getElementById('cfg-paga').value)   || 60,
    ore_soglia:     parseFloat(document.getElementById('cfg-soglia').value) || 8,
    paga_ora_extra: parseFloat(document.getElementById('cfg-extra').value)  || 10,
  });
  refreshStats();
  refreshCal();
});

/* ── HOME: main button ──────────────────────────── */
const btnMain      = document.getElementById('btn-main');
const inCorsoTxt   = document.getElementById('in-corso-txt');
const hdrMsg       = document.getElementById('hdr-msg');

function refreshHome() {
  const s = getStato();
  if (s) {
    btnMain.textContent = 'ESCI';
    btnMain.classList.add('esci');
    inCorsoTxt.textContent = 'In corso dalle ' + tsToHM(s.ts);
  } else {
    btnMain.textContent = 'ENTRA';
    btnMain.classList.remove('esci');
    inCorsoTxt.textContent = '';
  }
}

btnMain.addEventListener('click', () => {
  const s = getStato();
  if (!s) {
    saveStato({ ts: Date.now(), data: todayStr(), sito: '' });
    hdrMsg.textContent = 'Buon lavoro amore mio!🤍';
  } else {
    const all = getRecs();
    all.push({
      id:         uid(),
      data:       s.data,
      entrata:    tsToHM(s.ts),
      uscita:     tsToHM(Date.now()),
      entrata_ts: s.ts,
      uscita_ts:  Date.now(),
      sito:       s.sito || '',
      nota:       '',
      pagato:     false,
      importo:    0
    });
    saveRecs(all);
    saveStato(null);
    hdrMsg.textContent = 'Sei stata bravissima, come al solito!🤍';
    refreshStats();
    refreshCal();
  }
  refreshHome();
});

/* ── Settings ──────────────────────────────────── */
const CFG_KEY = 'pr_cfg';
function getSettings() {
  return Object.assign({ metodo: 1, paga_giornata: 60, ore_soglia: 8, paga_ora_extra: 10 },
    JSON.parse(localStorage.getItem(CFG_KEY) || '{}'));
}
function saveSettings(cfg) { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }

function calcolaImportoGiornata(min, cfg) {
  cfg = cfg || getSettings();
  const sogl = cfg.ore_soglia * 60;
  return min <= sogl ? cfg.paga_giornata : cfg.paga_giornata + ((min - sogl) / 60) * cfg.paga_ora_extra;
}
function setBar(gId, rId, pct) {
  document.getElementById(gId).style.width = (pct * 100).toFixed(1) + '%';
  document.getElementById(rId).style.width = ((1 - pct) * 100).toFixed(1) + '%';
}

/* ── REGISTRO: stats ─────────────────────────────── */
function refreshStats() {
  const all = getRecs();
  const cfg = getSettings();
  const t   = todayStr();
  const mon = mondayOf(t);
  const ym  = t.slice(0, 7);
  const monTs = new Date(mon + 'T00:00:00').getTime();
  const sunTs = monTs + 7 * 86400000;
  const inSett = r => { const d = new Date(r.data + 'T12:00:00').getTime(); return d >= monTs && d < sunTs; };

  if (cfg.metodo === 1) {
    const sumMin = fn => all.filter(fn).reduce((a, r) => a + recMin(r), 0);
    document.getElementById('s-oggi').textContent = fmtH(sumMin(r => r.data === t));
    document.getElementById('s-sett').textContent = fmtH(sumMin(inSett));
    document.getElementById('s-mese').textContent = fmtH(sumMin(r => r.data.startsWith(ym)));
    const pag  = all.filter(r =>  r.pagato && r.uscita_ts);
    const npag = all.filter(r => !r.pagato && r.uscita_ts);
    const pagM = pag.reduce((a, r) => a + recMin(r), 0);
    const pagE = pag.reduce((a, r) => a + (r.importo || 0), 0);
    const npM  = npag.reduce((a, r) => a + recMin(r) - (r.ore_pagate || 0), 0);
    const pct  = (pagM + npM) > 0 ? pagM / (pagM + npM) : 0;
    document.getElementById('box1-lbl').textContent = 'Pagato';
    document.getElementById('box1-val').textContent = fmtH(pagM);
    document.getElementById('box1-sub').textContent = pagE > 0 ? '€ ' + pagE.toFixed(2) : '—';
    document.getElementById('box2-lbl').textContent = 'Da pagare';
    document.getElementById('box2-val').textContent = fmtH(npM);
    document.getElementById('box2-sub').textContent = '';
    setBar('box1-bg','box1-br', pct);
    setBar('box2-bg','box2-br', 1 - pct);
  } else {
    const compHas = r => r.uscita_ts > 0;
    const fmtGg = n => n > 0 ? n + ' gg' : '—';
    document.getElementById('s-oggi').textContent = fmtGg(all.filter(r => r.data === t && compHas(r)).length);
    document.getElementById('s-sett').textContent = fmtGg(all.filter(r => inSett(r) && compHas(r)).length);
    document.getElementById('s-mese').textContent = fmtGg(all.filter(r => r.data.startsWith(ym) && compHas(r)).length);
    const pag  = all.filter(r =>  r.pagato && r.uscita_ts);
    const npag = all.filter(r => !r.pagato && r.uscita_ts);
    const pagE = pag.reduce((a, r) => a + (r.importo || 0), 0);
    const npE  = npag.reduce((a, r) => a + calcolaImportoGiornata(recMin(r)), 0);
    const tot  = pag.length + npag.length;
    const pct  = tot > 0 ? pag.length / tot : 0;
    document.getElementById('box1-lbl').textContent = 'Giornate pagate';
    document.getElementById('box1-val').textContent = pag.length > 0 ? pag.length + ' gg' : '—';
    document.getElementById('box1-sub').textContent = pagE > 0 ? '€ ' + pagE.toFixed(2) : '—';
    document.getElementById('box2-lbl').textContent = 'Da pagare';
    document.getElementById('box2-val').textContent = npag.length > 0 ? npag.length + ' gg' : '—';
    document.getElementById('box2-sub').textContent = npE > 0 ? '~ € ' + npE.toFixed(2) : '';
    setBar('box1-bg','box1-br', pct);
    setBar('box2-bg','box2-br', 1 - pct);
  }
}


/* ── REGISTRO: calendario ───────────────────────── */
let calY, calM;
(function() { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); })();

function refreshCal() {
  document.getElementById('c-label').textContent = MONTHS[calM] + ' ' + calY;

  const all    = getRecs();
  const t      = todayStr();
  const prefix = calY + '-' + String(calM + 1).padStart(2, '0');
  const days   = new Date(calY, calM + 1, 0).getDate();
  let   offset = new Date(calY, calM, 1).getDay(); // 0=dom
  offset = offset === 0 ? 6 : offset - 1;          // 0=lun

  // ore per giorno (totali e pagate)
  const hMap = {}, hPagMap = {};
  all.forEach(r => {
    if (r.data.startsWith(prefix)) {
      const m = recMin(r);
      hMap[r.data]    = (hMap[r.data]    || 0) + m;
      hPagMap[r.data] = (hPagMap[r.data] || 0) + (r.pagato ? m : (r.ore_pagate || 0));
    }
  });

  const DNAMES = ['Lu','Ma','Me','Gi','Ve','Sa','Do'];
  let html = DNAMES.map(d => '<div class="cal-hdr">' + d + '</div>').join('');
  for (let i = 0; i < offset; i++) html += '<div class="cal-cell"></div>';

  for (let d = 1; d <= days; d++) {
    const ds     = prefix + '-' + String(d).padStart(2, '0');
    const min    = hMap[ds] || 0;
    const minPag = hPagMap[ds] || 0;
    const cls    = ['cal-cell', 'cal-day', min > 0 && 'has-data', ds === t && 'today'].filter(Boolean).join(' ');
    let bar = '';
    if (min > 0) {
      const pct = Math.min(minPag / min, 1);
      bar = '<div class="cal-bar">'
          + '<div class="cal-bar-g" style="width:' + (pct * 100).toFixed(1) + '%"></div>'
          + '<div class="cal-bar-r" style="width:' + ((1 - pct) * 100).toFixed(1) + '%"></div>'
          + '</div>';
    }
    html += '<div class="' + cls + '" style="cursor:pointer" onclick="openDay(\'' + ds + '\')">'
          + '<span class="cn">' + d + '</span>'
          + (min > 0 ? '<span class="ch">' + fmtH(min) + '</span>' : '')
          + bar
          + '</div>';
  }

  document.getElementById('cal-grid').innerHTML = html;
}

document.getElementById('c-prev').addEventListener('click', () => {
  calM--; if (calM < 0) { calM = 11; calY--; } refreshCal();
});
document.getElementById('c-next').addEventListener('click', () => {
  calM++; if (calM > 11) { calM = 0; calY++; } refreshCal();
});

/* ── MODAL: giorno ──────────────────────────────── */
let currentDay = null;

function openDay(ds) {
  currentDay = ds;
  const d = new Date(ds + 'T12:00:00');
  document.getElementById('day-title').textContent = d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  renderDayBody(ds);
  openModal('ov-day');
}

function renderDayBody(ds) {
  const list = getRecs().filter(r => r.data === ds);

  const addBtn = '<button class="btn-add" onclick="addTimbratura(\'' + ds + '\')">+ Aggiungi timbratura</button>';

  if (!list.length) {
    document.getElementById('day-body').innerHTML = '<p class="empty-note">Nessuna timbratura per questo giorno.</p>' + addBtn;
    return;
  }

  const html = list.map((r, i) => {
    return '<div class="timb-card">'
      + '<div class="timb-lbl">Timbratura ' + (i + 1) + '</div>'

      + '<div class="fg"><label>Entrata</label>'
      + '<input type="time" value="' + r.entrata + '" onchange="patchRec(\'' + r.id + '\',\'entrata\',this.value)"></div>'

      + '<div class="fg"><label>Uscita</label>'
      + '<input type="time" value="' + (r.uscita || '') + '" onchange="patchRec(\'' + r.id + '\',\'uscita\',this.value)"></div>'

      + '<div class="fg"><label>Note</label>'
      + '<textarea onchange="patchRec(\'' + r.id + '\',\'nota\',this.value)">' + (r.nota || '') + '</textarea></div>'

      + '<div class="check-row">'
      + '<input type="checkbox" id="chk-' + r.id + '"' + (r.pagato ? ' checked' : '') + ' onchange="patchRec(\'' + r.id + '\',\'pagato\',this.checked)">'
      + '<label for="chk-' + r.id + '">PAGATO</label></div>'

      + (r.pagato
          ? '<div class="fg" style="margin-top:10px;"><label>Importo (€)</label>'
          + '<input type="number" step="0.01" min="0" value="' + (r.importo || 0) + '" onchange="patchRec(\'' + r.id + '\',\'importo\',parseFloat(this.value)||0)"></div>'
          : '')

      + '<button class="btn-del" onclick="delRec(\'' + r.id + '\')">Elimina timbratura</button>'
      + '</div>';
  }).join('');

  document.getElementById('day-body').innerHTML = html + addBtn;
}

function patchRec(id, field, value) {
  const all = getRecs();
  const r   = all.find(r => r.id === id);
  if (!r) return;
  r[field] = value;
  if (field === 'entrata') r.entrata_ts = hmToTs(r.data, value);
  if (field === 'uscita')  r.uscita_ts  = hmToTs(r.data, value);
  saveRecs(all);
  if (field === 'pagato') renderDayBody(currentDay); // mostra/nasconde campo importo
  refreshStats();
  refreshCal();
}

function delRec(id) {
  const all = getRecs();
  const idx = all.findIndex(r => r.id === id);
  if (idx === -1) return;
  _undoRec = { rec: all[idx], idx };
  clearTimeout(_undoTimer);
  _undoTimer = setTimeout(() => { _undoRec = null; }, 3200);
  all.splice(idx, 1);
  saveRecs(all);
  renderDayBody(currentDay);
  refreshStats();
  refreshCal();
  showToast('Eliminata &nbsp;·&nbsp; <span onclick="undoDel()" style="text-decoration:underline;cursor:pointer;color:var(--text)">ANNULLA</span>');
}

/* ── MODAL: paga ──────────────────────────────────── */
function buildPagaBody() {
  const cfg  = getSettings();
  const all  = getRecs();
  const npag = all.filter(r => !r.pagato && r.uscita_ts).sort((a, b) => a.entrata_ts - b.entrata_ts);
  const el   = document.getElementById('paga-body');

  if (cfg.metodo === 1) {
    const npM = all.filter(r => !r.pagato && r.uscita_ts).reduce((a, r) => a + recMin(r) - (r.ore_pagate || 0), 0);
    const ref = npM > 0 ? '<p style="font-size:13px;color:var(--soft);margin:0 0 16px">Non pagate: <strong style="color:var(--text)">' + fmtH(npM) + '</strong></p>' : '';
    el.innerHTML = ref +
      '<div class="fg"><label>Ore pagate</label><input type="number" id="p-ore" min="0" step="0.5"></div>' +
      '<div class="fg"><label>Importo € (opz.)</label><input type="number" id="p-imp" min="0" step="0.01"></div>';
  } else {
    let html = '<p style="font-size:13px;color:var(--soft);margin:0 0 12px">Seleziona le giornate da pagare (vuoto = tutte dal più vecchio)</p>';
    if (!npag.length) {
      html = '<p style="color:var(--soft);font-size:13px">Nessuna giornata da pagare.</p>';
    } else {
      npag.forEach(r => {
        const min = recMin(r);
        const imp = calcolaImportoGiornata(min);
        html += '<label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer">' +
          '<input type="checkbox" class="paga-chk" data-id="' + r.id + '" data-imp="' + imp.toFixed(2) + '">' +
          '<span style="flex:1"><span style="font-weight:600">' + fmtDataIt(r.data) + '</span>' +
          ' &nbsp; ' + (r.entrata || '') + '–' + (r.uscita || '') +
          ' &nbsp; <span style="color:var(--soft)">' + fmtH(min) + '</span></span>' +
          '<span style="color:var(--soft);font-size:13px">€ ' + imp.toFixed(2) + '</span>' +
          '</label>';
      });
    }
    el.innerHTML = html;
  }
}

document.getElementById('btn-paga').addEventListener('click', () => {
  buildPagaBody();
  openModal('ov-paga');
});

document.getElementById('btn-salva-paga').addEventListener('click', () => {
  const cfg = getSettings();
  const all = getRecs();

  if (cfg.metodo === 1) {
    const oreIn   = parseFloat(document.getElementById('p-ore').value) || 0;
    const importo = parseFloat(document.getElementById('p-imp').value) || 0;
    if (!oreIn) { alert('Inserisci le ore pagate.'); return; }
    let minRimasti = Math.round(oreIn * 60);
    const candidati = all.filter(r => !r.pagato && r.uscita_ts).sort((a, b) => a.entrata_ts - b.entrata_ts);
    const minTot = Math.min(minRimasti, candidati.reduce((a, r) => a + recMin(r) - (r.ore_pagate || 0), 0));
    for (const r of candidati) {
      if (minRimasti <= 0) break;
      const minDisp = recMin(r) - (r.ore_pagate || 0);
      const quota   = minTot > 0 ? (Math.min(minDisp, minRimasti) / minTot) * importo : 0;
      if (minRimasti >= minDisp) {
        r.pagato = true; r.importo = Math.round(quota * 100) / 100; delete r.ore_pagate; minRimasti -= minDisp;
      } else {
        r.ore_pagate = (r.ore_pagate || 0) + minRimasti; r.importo = Math.round(quota * 100) / 100; minRimasti = 0;
      }
    }
  } else {
    // Metodo 2: giornate
    const chks = [...document.querySelectorAll('.paga-chk:checked')];
    let candidati;
    if (chks.length) {
      const ids = new Set(chks.map(c => c.dataset.id));
      candidati = all.filter(r => ids.has(r.id));
    } else {
      // nessuna selezione: tutte dal più vecchio
      candidati = all.filter(r => !r.pagato && r.uscita_ts).sort((a, b) => a.entrata_ts - b.entrata_ts);
      if (!candidati.length) { closeModal('ov-paga'); return; }
      if (!confirm('Segna come pagate tutte le ' + candidati.length + ' giornate non pagate?')) return;
    }
    for (const r of candidati) {
      r.pagato  = true;
      r.importo = calcolaImportoGiornata(recMin(r));
    }
    saveRecs(all);
    closeModal('ov-paga');
    refreshStats();
    refreshCal();
    showToast(candidati.length + ' giornate segnate come pagate');
    return;
  }

  saveRecs(all);
  closeModal('ov-paga');
  refreshStats();
  refreshCal();
  showToast('Pagamento applicato');
});


/* ── EXPORT Excel ───────────────────────────────── */
document.getElementById('btn-export').addEventListener('click', () => {
  const all = getRecs();
  if (!all.length) { alert('Nessun dato da esportare.'); return; }

  const rows = [...all]
    .sort((a, b) => a.data.localeCompare(b.data))
    .map(r => {
      const min = recMin(r);
      const h   = Math.floor(min / 60);
      const m   = Math.round(min % 60);
      return {
        'Data':          r.data,
        'Entrata':       r.entrata,
        'Uscita':        r.uscita || '',
        'Ore':           min ? h + ':' + String(m).padStart(2,'0') : '',
        'Ore (decimali)': min ? +(min / 60).toFixed(2) : '',
        'Sito':          sitoLabel(r.sito),
        'Nota':          r.nota || '',
        'Pagato':        r.pagato ? 'Sì' : 'No',
        'Importo €':     r.importo || ''
      };
    });

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [12, 8, 8, 8, 14, 8, 22, 8, 10].map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Presenze');
  XLSX.writeFile(wb, 'presenze_' + todayStr() + '.xlsx');
});

/* ── Aggiungi timbratura manuale ────────────────── */
function addTimbratura(ds) {
  const body = document.getElementById('day-body');
  // sostituisce il bottone + con il form inline
  const form = body.querySelector('.timb-form');
  if (form) return; // già aperto
  const div = document.createElement('div');
  div.className = 'timb-form';
  div.innerHTML =
    '<div class="fg"><label>Entrata</label><input type="time" id="tf-in"></div>'
  + '<div class="fg"><label>Uscita</label><input type="time" id="tf-out"></div>'
  + '<button class="btn-cta" onclick="confirmTimbratura(\'' + ds + '\')">Conferma</button>'
  + '<button class="btn-del" onclick="renderDayBody(\'' + ds + '\')">Annulla</button>';
  body.querySelector('.btn-add').replaceWith(div);
}

function confirmTimbratura(ds) {
  const entrata = document.getElementById('tf-in').value;
  const uscita  = document.getElementById('tf-out').value;
  if (!entrata) { alert('Inserisci almeno l\'orario di entrata.'); return; }
  const all = getRecs();
  all.push({
    id: uid(), data: ds,
    entrata, uscita,
    entrata_ts: hmToTs(ds, entrata),
    uscita_ts:  uscita ? hmToTs(ds, uscita) : 0,
    sito: '', nota: '', pagato: false, importo: 0
  });
  saveRecs(all);
  renderDayBody(ds);
  refreshStats();
  refreshCal();
}


/* ── Init ───────────────────────────────────────── */
refreshHome();
refreshStats();
refreshCal();
setTimeout(() => document.getElementById('splash').remove(), 2500);
</script>
