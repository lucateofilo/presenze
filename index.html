<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* evita pull-to-refresh e bounce accidentali */
html, body { overscroll-behavior: none; }

/* elimina highlight blu al tap */
* { -webkit-tap-highlight-color: transparent; }

/* elimina delay 300ms su tutti i bottoni e label */
button, label, a { touch-action: manipulation; }

:root {
  --bg:      #0d0d0d;
  --surface: #111;
  --border:  #1f1f1f;
  --muted:   #444;
  --soft:    #666;
  --text:    #fff;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}

/* ── HEADER ── */
header {
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
#btn-diary {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  color: var(--soft);
  transition: color 0.2s;
  line-height: 0;
}
#btn-diary:hover { color: var(--text); }
#btn-diary.active { color: var(--text); }

.diary-banner {
  margin-top: 16px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--soft);
  display: flex;
  align-items: center;
  gap: 10px;
}
.diary-banner-btn {
  background: none;
  border: none;
  color: var(--text);
  font-size: 12px;
  text-decoration: underline;
  cursor: pointer;
  padding: 0;
  white-space: nowrap;
}
#diary-nota {
  resize: vertical;
  height: 220px;
}

#btn-gear {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  color: var(--soft);
  transition: color 0.2s;
  line-height: 0;
}
#btn-gear:hover { color: var(--text); }
#btn-gear.active { color: var(--text); }

.hdr-title {
  font-size: 18px;
  letter-spacing: 6px;
  color: var(--muted);
  text-transform: uppercase;
}

.home-msg {
  font-size: 20px;
  color: var(--soft);
  text-align: center;
  margin-bottom: 32px;
  line-height: 1.4;
  min-height: 28px;
}

/* ── NAV ── */
nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  background: var(--bg);
  border-top: 1px solid var(--border);
  z-index: 50;
  max-width: 480px;
  margin: 0 auto;
  /* safe area per iPhone con home bar */
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1;
  padding: 18px;
  background: none;
  border: none;
  color: var(--soft);
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.2s;
  min-height: 58px;
}
nav button.active {
  color: var(--text);
  border-top: 1px solid var(--text);
  margin-top: -1px;
}

/* ── VIEWS ── */
.view { display: none; padding: 0 20px calc(90px + env(safe-area-inset-bottom)); }
.view.active { display: block; }

/* ── HOME ── */
#v-home {
  display: none;
  flex-direction: column;
  min-height: calc(100vh - 120px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
#v-home.active { display: flex; }

.home-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.home-bottom {
  padding-bottom: 16px;
  display: flex;
  justify-content: center;
}

#btn-main {
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--text);
  color: var(--text);
  font-size: 30px;
  font-weight: 300;
  letter-spacing: 5px;
  cursor: pointer;
  transition: all 0.15s;
  outline: none;
}
#btn-main:active { transform: scale(0.95); }
#btn-main.esci   { border-color: var(--muted); color: var(--muted); }


.in-corso-txt {
  margin-top: 16px;
  font-size: 12px;
  color: var(--soft);
  letter-spacing: 0.5px;
  min-height: 16px;
  text-align: center;
}

#btn-paga {
  display: block;
  margin: 0;
  padding: 14px 48px;
  background: none;
  border: 1px solid var(--border);
  color: var(--soft);
  font-size: 11px;
  letter-spacing: 3px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
}
#btn-paga:hover { border-color: var(--muted); color: var(--text); }

/* ── REGISTRO ── */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--border);
  margin-top: 24px;
  margin-bottom: 0;
}
.anno-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-top: none;
  margin-bottom: 20px;
  font-size: 11px;
  color: var(--soft);
  letter-spacing: 0.5px;
}
.stat {
  padding: 16px 8px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.stat:last-child { border-right: none; }
.stat-lbl {
  font-size: 10px;
  color: var(--soft);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.stat-val {
  font-size: 20px;
  font-weight: 300;
}

/* splash */
#splash {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  animation: splashFade 0.8s ease 1.7s forwards;
}
#splash-heart {
  width: 80px;
  height: 80px;
  fill: var(--text);
  animation: heartGrow 1.7s cubic-bezier(0.2, 0, 0.6, 1) reverse forwards;
}
@keyframes heartGrow {
  0%   { transform: scale(0.1); opacity: 0; }
  15%  { opacity: 1; }
  100% { transform: scale(55); }
}
@keyframes splashFade {
  to { opacity: 0; pointer-events: none; }
}

/* totali pagato/non pagato */
.totali-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 28px;
}
.totale-box {
  text-align: center;
  border: 1px solid var(--border);
  padding: 16px 8px 18px;
  position: relative;
}
.totale-lbl {
  font-size: 9px;
  color: var(--soft);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.totale-ore {
  font-size: 28px;
  font-weight: 200;
  line-height: 1;
  letter-spacing: -1px;
}
.totale-eur {
  font-size: 12px;
  color: var(--soft);
  margin-top: 6px;
  letter-spacing: 0.5px;
}
.totale-bar-wrap {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: var(--border);
}
.totale-bar { height: 100%; }
.totale-bar.green { background: #2a5c24; }
.totale-bar.red   { background: #5c2424; }

.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.cal-nav button {
  background: none;
  border: none;
  color: var(--soft);
  font-size: 22px;
  cursor: pointer;
  padding: 4px 14px;
  line-height: 1;
}
.cal-nav span { font-size: 13px; color: var(--muted); letter-spacing: 1px; }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.cal-hdr {
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  padding: 6px 0;
  letter-spacing: 1px;
}
.cal-cell {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  font-size: 12px;
  padding: 2px;
  cursor: default;
  transition: background 0.1s;
}
.cal-cell.today   { border-color: var(--muted); }
.cal-cell.has-data {
  background: #161616;
  border-color: var(--border);
  cursor: pointer;
}
.cal-cell.has-data:hover { background: #1e1e1e; }
.cal-cell.cal-day:not(.has-data):hover { background: #141414; }
.cal-day { touch-action: manipulation; }
.cal-cell .cn { font-size: 13px; }
.cal-cell .ch { font-size: 10px; color: var(--soft); margin-top: 2px; }
.cal-bar { display: flex; width: 100%; height: 3px; margin-top: 6px; border-radius: 1px; overflow: hidden; }
.cal-bar-g { background: #2a5c24; height: 100%; }
.cal-bar-r { background: #5c2424; height: 100%; }

#btn-new-diary {
  display: block;
  width: 100%;
  margin-top: 16px;
  margin-bottom: 8px;
  padding: 12px;
  background: none;
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  touch-action: manipulation;
}
#btn-new-diary:active { background: var(--surface); }

.diary-item {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
  touch-action: manipulation;
}
.diary-item-date { font-size: 11px; color: var(--soft); letter-spacing: 1px; }
.diary-item-preview { font-size: 14px; color: var(--text); }
.diary-empty { padding: 24px 0; font-size: 13px; color: var(--soft); text-align: center; }

#btn-diary-export {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 12px;
  background: none;
  border: 1px solid var(--border);
  color: var(--soft);
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
  touch-action: manipulation;
}
#btn-diary-export:hover { border-color: var(--muted); color: var(--text); }

#btn-export {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 12px;
  background: none;
  border: 1px solid var(--border);
  color: var(--soft);
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
}
#btn-export:hover { border-color: var(--muted); color: var(--text); }

/* ── OVERLAYS ── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.overlay.open { display: flex; }

.sheet {
  background: var(--surface);
  border-top: 1px solid var(--border);
  width: 100%;
  max-width: 480px;
  padding: 22px 20px calc(28px + env(safe-area-inset-bottom));
  max-height: 88vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.sheet-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.sheet-top h2 { font-size: 14px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; }
.btn-close {
  background: none;
  border: none;
  color: var(--soft);
  font-size: 24px;
  cursor: pointer;
  line-height: 1;
  padding: 0 2px;
}

/* form elements */
.fg { margin-bottom: 14px; }
.fg > label {
  display: block;
  font-size: 10px;
  color: var(--soft);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.fg input[type=time],
.fg input[type=number],
.fg textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px;
  font-size: 16px; /* min 16px evita zoom automatico su iOS */
  font-family: inherit;
  outline: none;
  border-radius: 0;
  -webkit-appearance: none;
}
.fg input:focus, .fg textarea:focus { border-color: var(--muted); }
.fg textarea { resize: none; height: 58px; }

.radio2 { display: flex; gap: 8px; }
.radio2 input[type=radio] { display: none; }
.radio2 label {
  flex: 1;
  border: 1px solid var(--border);
  color: var(--soft);
  text-align: center;
  padding: 10px 8px;
  font-size: 11px;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
  user-select: none;
}
.radio2 input:checked + label { border-color: var(--muted); color: var(--text); }

.check-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
}
.check-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--text); flex-shrink: 0; }
.check-row label { font-size: 12px; color: var(--soft); cursor: pointer; letter-spacing: 0.5px; }

.timb-card { border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; }
.timb-lbl  { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }


.btn-cta {
  width: 100%;
  padding: 14px;
  background: var(--text);
  color: var(--bg);
  border: none;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 20px;
  font-weight: 700;
  transition: background 0.15s;
}
.btn-cta:hover { background: #ddd; }

.btn-del {
  width: 100%;
  padding: 10px;
  background: none;
  border: 1px solid #2a2a2a;
  color: var(--soft);
  font-size: 11px;
  letter-spacing: 1px;
  cursor: pointer;
  margin-top: 8px;
  text-transform: uppercase;
  transition: all 0.15s;
}
.btn-del:hover { border-color: var(--muted); color: var(--text); }

.empty-note { font-size: 13px; color: var(--muted); padding: 10px 0; }

/* toast */
.toast {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom) + 12px);
  left: 50%; transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--soft);
  font-size: 13px;
  padding: 10px 18px;
  white-space: nowrap;
  z-index: 500;
  animation: toastIn 0.2s ease, toastOut 0.3s ease 2.7s forwards;
}
.toast.ok  { border-color: #2a2a2a; color: var(--text); }
.toast.err { border-color: #5c1f1f; color: #ff6b6b; background: #1a0a0a; }
@keyframes toastIn  { from { opacity: 0; transform: translateX(-50%) translateY(8px); } }
@keyframes toastOut { to   { opacity: 0; } }

/* confirm modal */
#ov-confirm .sheet { padding-bottom: calc(env(safe-area-inset-bottom) + 24px); }
#ov-confirm p { font-size: 15px; color: var(--text); margin-bottom: 20px; line-height: 1.5; }
.confirm-btns { display: flex; gap: 10px; }
.confirm-btns button { flex: 1; padding: 14px; border: 1px solid var(--border); background: none; color: var(--text); font-size: 14px; cursor: pointer; touch-action: manipulation; }
.confirm-btns button:first-child { color: var(--soft); }
.confirm-btns button:last-child  { border-color: var(--text); }

/* pulse sul btn-main */
@keyframes btnPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.15); } 50% { box-shadow: 0 0 0 14px rgba(255,255,255,0); } }
#btn-main.pulsed { animation: btnPulse 0.5s ease; }


/* aggiungi timbratura */
.btn-add {
  width: 100%;
  padding: 12px;
  background: none;
  border: 1px dashed var(--border);
  color: var(--soft);
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  margin-top: 4px;
  transition: all 0.15s;
  text-transform: uppercase;
}
.btn-add:hover { border-color: var(--muted); color: var(--text); }


</style>
</head>
<body>

<div id="splash">
  <svg id="splash-heart" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
  </svg>
</div>

<header>
  <div class="hdr-title">Presenze</div>
  <button id="btn-diary" aria-label="Diario">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
    </svg>
  </button>
  <button id="btn-gear" aria-label="Impostazioni">

<script>
'use strict';

/* ── Storage ────────────────────────────────────── */
const REC_KEY = 'pr_records';
const STA_KEY = 'pr_stato';

function getRecs()      { return JSON.parse(localStorage.getItem(REC_KEY) || '[]'); }
function saveRecs(r)    { localStorage.setItem(REC_KEY, JSON.stringify(r)); }
function getStato()     { return JSON.parse(localStorage.getItem(STA_KEY) || 'null'); }
function saveStato(s)   { s == null ? localStorage.removeItem(STA_KEY) : localStorage.setItem(STA_KEY, JSON.stringify(s)); }

/* ── Utils ──────────────────────────────────────── */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function todayStr() { return new Date().toISOString().slice(0, 10); }

function tsToHM(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function hmToTs(dateStr, hm) {
  const [h, m] = hm.split(':').map(Number);
  const d = new Date(dateStr + 'T12:00:00');
  d.setHours(h, m, 0, 0);
  return d.getTime();
}

function recMin(r) {
  return (r.uscita_ts && r.entrata_ts) ? (r.uscita_ts - r.entrata_ts) / 60000 : 0;
}

function fmtH(min) {
  if (!min || min <= 0) return '—';
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  return m ? h + 'h' + String(m).padStart(2,'0') : h + 'h';
}

function mondayOf(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  return d.toISOString().slice(0, 10);
}

function sitoLabel(s) {
  return s === 'B' ? 'Sito' : s === 'N' ? 'Sede' : '';
}

const MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

function fmtDataIt(ds) {
  const d = new Date(ds + 'T12:00:00');
  const gg = ['Do','Lu','Ma','Me','Gi','Ve','Sa'][d.getDay()];
  return gg + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3);
}

/* ── Overlays ───────────────────────────────────── */
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

let _undoRec = null, _undoTimer = null;
function undoDel() {
  if (!_undoRec) return;
  clearTimeout(_undoTimer);
  const all = getRecs();
  all.splice(_undoRec.idx, 0, _undoRec.rec);
  saveRecs(all);
  _undoRec = null;
  renderDayBody(currentDay);
  refreshStats();
  refreshCal();
}

document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); });
});
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close));
});

/* ── Nav ────────────────────────────────────────── */
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('v-' + btn.dataset.view).classList.add('active');
    document.getElementById('btn-gear').classList.remove('active');
    document.getElementById('btn-diary').classList.remove('active');
    if (btn.dataset.view === 'reg') { refreshStats(); refreshCal(); }
  });
});


/* ── Gear button ─────────────────────────────────── */
document.getElementById('btn-gear').addEventListener('click', () => {
  const gear = document.getElementById('btn-gear');
  const isSet = document.getElementById('v-set').classList.contains('active');
  if (isSet) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('v-home').classList.add('active');
    document.querySelector('nav button[data-view="home"]').classList.add('active');
    gear.classList.remove('active');
  } else {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-diary').classList.remove('active');
    document.getElementById('v-set').classList.add('active');
    gear.classList.add('active');
    initCfgForm();
  }
});

/* ── Diary button ────────────────────────────────── */
document.getElementById('btn-diary').addEventListener('click', () => {
  const btn   = document.getElementById('btn-diary');
  const isDiary = document.getElementById('v-diary').classList.contains('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-gear').classList.remove('active');
  if (isDiary) {
    document.getElementById('v-home').classList.add('active');
    document.querySelector('nav button[data-view="home"]').classList.add('active');
    btn.classList.remove('active');
  } else {
    document.getElementById('v-diary').classList.add('active');
    btn.classList.add('active');
    checkDiaryBanner();
    refreshDiaryList();
  }
});

/* ── IMPOSTAZIONI ─────────────────────────────────── */
function showCfgSections(tipo) {
  document.getElementById('cfg-ore').style.display      = tipo === 'ore' ? '' : 'none';
  document.getElementById('cfg-giornata').style.display = tipo === 'giornata' ? '' : 'none';
}
function showExtraFields(show) {
  document.getElementById('cfg-extra-fields').style.display = show ? '' : 'none';
}
function initCfgForm() {
  const cfg = getSettings();
  document.querySelector('input[name="tipo"][value="' + cfg.tipo + '"]').checked = true;
  document.getElementById('cfg-paga-ora').value  = cfg.paga_ora;
  document.getElementById('cfg-extra-chk').checked = cfg.extra;
  document.getElementById('cfg-soglia').value    = cfg.ore_soglia;
  document.getElementById('cfg-paga-extra').value = cfg.paga_ora_extra;
  document.getElementById('cfg-paga-gg').value   = cfg.paga_giornata;
  showCfgSections(cfg.tipo);
  showExtraFields(cfg.extra);
}
document.querySelectorAll('input[name="tipo"]').forEach(r => {
  r.addEventListener('change', () => showCfgSections(r.value));
});
document.getElementById('cfg-extra-chk').addEventListener('change', function() {
  showExtraFields(this.checked);
});
document.getElementById('btn-salva-cfg').addEventListener('click', () => {
  const tipo = document.querySelector('input[name="tipo"]:checked').value;
  saveSettings({
    tipo,
    paga_ora:       parseFloat(document.getElementById('cfg-paga-ora').value)   || 10,
    extra:          document.getElementById('cfg-extra-chk').checked,
    ore_soglia:     parseFloat(document.getElementById('cfg-soglia').value)     || 8,
    paga_ora_extra: parseFloat(document.getElementById('cfg-paga-extra').value) || 15,
    paga_giornata:  parseFloat(document.getElementById('cfg-paga-gg').value)    || 60,
  });
  refreshStats();
  refreshCal();
  showToast('Impostazioni salvate', 'ok');
});

/* ── HOME: main button ──────────────────────────── */
const btnMain      = document.getElementById('btn-main');
const inCorsoTxt   = document.getElementById('in-corso-txt');
const hdrMsg       = document.getElementById('hdr-msg');

function refreshHome() {
  const s = getStato();
  if (s) {
    btnMain.textContent = 'ESCI';
    btnMain.classList.add('esci');
    inCorsoTxt.textContent = 'In corso dalle ' + tsToHM(s.ts);
  } else {
    btnMain.textContent = 'ENTRA';
    btnMain.classList.remove('esci');
    inCorsoTxt.textContent = '';
  }
}

btnMain.addEventListener('click', () => {
  btnMain.classList.remove('pulsed');
  void btnMain.offsetWidth;
  btnMain.classList.add('pulsed');
  const s   = getStato();
  const cfg = getSettings();
  if (!s) {
    const now = Date.now();
    const all = getRecs();
    const newId = uid();
    all.push({ id: newId, data: todayStr(), entrata: tsToHM(now), uscita: '', entrata_ts: now, uscita_ts: 0, sito: '', nota: '', pagato: false, importo: 0 });
    saveRecs(all);
    saveStato({ ts: now, data: todayStr(), sito: '', rec_id: newId });
    refreshStats();
    refreshCal();
    hdrMsg.textContent = 'Buon lavoro amore mio!🤍';
    showToast('Presenza segnata', 'ok');
  } else {
    const all = getRecs();
    if (s.rec_id) {
      const rec = all.find(r => r.id === s.rec_id);
      if (rec) { rec.uscita = tsToHM(Date.now()); rec.uscita_ts = Date.now(); saveRecs(all); }
    }
    saveStato(null);
    hdrMsg.textContent = 'Sei stata bravissima, come al solito!🤍';
    refreshStats();
    refreshCal();
    showToast('Timbratura salvata', 'ok');
  }
  refreshHome();
});

/* ── Settings ──────────────────────────────────── */
const CFG_KEY = 'pr_cfg';
function getSettings() {
  const d = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
  // migrazione vecchio formato (metodo 1/2/3)
  if (d.metodo !== undefined && d.tipo === undefined) {
    d.tipo = d.metodo === 1 ? 'ore' : 'giornata';
    d.paga_ora = 10;
    d.extra = false;
    delete d.metodo;
  }
  return Object.assign({ tipo: 'ore', paga_ora: 10, extra: false, ore_soglia: 8, paga_ora_extra: 15, paga_giornata: 60 }, d);
}
function saveSettings(cfg) { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }

function calcolaImporto(min, cfg) {
  cfg = cfg || getSettings();
  if (cfg.tipo === 'giornata') return cfg.paga_giornata;
  const ore = min / 60;
  if (!cfg.extra || min <= cfg.ore_soglia * 60) return ore * cfg.paga_ora;
  return cfg.ore_soglia * cfg.paga_ora + ((min - cfg.ore_soglia * 60) / 60) * cfg.paga_ora_extra;
}
function setBar(barId, pct) {
  document.getElementById(barId).style.width = (pct * 100).toFixed(1) + '%';
}

/* ── REGISTRO: stats ─────────────────────────────── */
function refreshStats() {
  const all = getRecs();
  const cfg = getSettings();
  const t   = todayStr();
  const mon = mondayOf(t);
  const ym  = t.slice(0, 7);
  const monTs = new Date(mon + 'T00:00:00').getTime();
  const sunTs = monTs + 7 * 86400000;
  const inSett = r => { const d = new Date(r.data + 'T12:00:00').getTime(); return d >= monTs && d < sunTs; };

  if (cfg.tipo === 'ore') {
    const conUscita = r => r.uscita_ts > 0;
    const sumMin = fn => all.filter(fn).reduce((a, r) => a + recMin(r), 0);
    document.getElementById('s-oggi').textContent = fmtH(sumMin(r => r.data === t && conUscita(r)));
    document.getElementById('s-sett').textContent = fmtH(sumMin(r => inSett(r) && conUscita(r)));
    document.getElementById('s-mese').textContent = fmtH(sumMin(r => r.data.startsWith(ym) && conUscita(r)));
    const pag  = all.filter(r =>  r.pagato && r.uscita_ts);
    const npag = all.filter(r => !r.pagato && r.uscita_ts);
    const pagM = pag.reduce((a, r) => a + recMin(r), 0);
    const pagE = pag.reduce((a, r) => a + (r.importo || 0), 0);
    const npM  = npag.reduce((a, r) => a + recMin(r) - (r.ore_pagate || 0), 0);
    const pct  = (pagM + npM) > 0 ? pagM / (pagM + npM) : 0;
    document.getElementById('box1-lbl').textContent = 'Pagato';
    document.getElementById('box1-val').textContent = fmtH(pagM);
    document.getElementById('box1-sub').textContent = pagE > 0 ? '€ ' + pagE.toFixed(2) : '—';
    document.getElementById('box2-lbl').textContent = 'Da pagare';
    document.getElementById('box2-val').textContent = fmtH(npM);
    document.getElementById('box2-sub').textContent = '';
    setBar('box1-bar', pct);
    setBar('box2-bar', 1 - pct);
  } else {
    // a giornata — basta l'entrata
    const fmtGg = n => n > 0 ? n + ' gg' : '—';
    document.getElementById('s-oggi').textContent = fmtGg(all.filter(r => r.data === t).length);
    document.getElementById('s-sett').textContent = fmtGg(all.filter(r => inSett(r)).length);
    document.getElementById('s-mese').textContent = fmtGg(all.filter(r => r.data.startsWith(ym)).length);
    const pag  = all.filter(r =>  r.pagato);
    const npag = all.filter(r => !r.pagato);
    const pagE = pag.reduce((a, r) => a + (r.importo || 0), 0);
    const npE  = npag.reduce((a, r) => a + calcolaImporto(recMin(r)), 0);
    const tot  = pag.length + npag.length;
    const pct  = tot > 0 ? pag.length / tot : 0;
    document.getElementById('box1-lbl').textContent = 'Giornate pagate';
    document.getElementById('box1-val').textContent = pag.length > 0 ? pag.length + ' gg' : '—';
    document.getElementById('box1-sub').textContent = pagE > 0 ? '€ ' + pagE.toFixed(2) : '—';
    document.getElementById('box2-lbl').textContent = 'Da pagare';
    document.getElementById('box2-val').textContent = npag.length > 0 ? npag.length + ' gg' : '—';
    document.getElementById('box2-sub').textContent = npE > 0 ? '~ € ' + npE.toFixed(2) : '';
    setBar('box1-bar', pct);
    setBar('box2-bar', 1 - pct);
  }

  // riepilogo annuale
  const anno = t.slice(0, 4);
  const inAnno = r => r.data.startsWith(anno);
  document.getElementById('s-anno-lbl').textContent = 'Anno ' + anno;
  if (cfg.tipo === 'ore') {
    const minA = all.filter(r => inAnno(r) && r.uscita_ts).reduce((a, r) => a + recMin(r), 0);
    const eurA = all.filter(r => inAnno(r) && r.pagato).reduce((a, r) => a + (r.importo || 0), 0);
    document.getElementById('s-anno-val').textContent = minA > 0 ? fmtH(minA) : '—';
    document.getElementById('s-anno-eur').textContent = eurA > 0 ? '€ ' + eurA.toFixed(2) : '';
  } else {
    const ggA = all.filter(inAnno).length;
    const eurA = all.filter(r => inAnno(r) && r.pagato).reduce((a, r) => a + (r.importo || 0), 0);
    document.getElementById('s-anno-val').textContent = ggA > 0 ? ggA + ' gg' : '—';
    document.getElementById('s-anno-eur').textContent = eurA > 0 ? '€ ' + eurA.toFixed(2) : '';
  }
}


/* ── REGISTRO: calendario ───────────────────────── */
let calY, calM;
(function() { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); })();

function refreshCal() {
  document.getElementById('c-label').textContent = MONTHS[calM] + ' ' + calY;

  const all    = getRecs();
  const t      = todayStr();
  const prefix = calY + '-' + String(calM + 1).padStart(2, '0');
  const days   = new Date(calY, calM + 1, 0).getDate();
  let   offset = new Date(calY, calM, 1).getDay(); // 0=dom
  offset = offset === 0 ? 6 : offset - 1;          // 0=lun

  // ore per giorno (totali, pagate, conteggio, checkpoint senza uscita)
  const hMap = {}, hPagMap = {}, cntMap = {}, presMap = {};
  all.forEach(r => {
    if (r.data.startsWith(prefix)) {
      const m = recMin(r);
      hMap[r.data]    = (hMap[r.data]    || 0) + m;
      hPagMap[r.data] = (hPagMap[r.data] || 0) + (r.pagato ? m : (r.ore_pagate || 0));
      cntMap[r.data]  = (cntMap[r.data]  || 0) + 1;
      if (!r.uscita_ts) presMap[r.data] = (presMap[r.data] || 0) + 1;
    }
  });

  const DNAMES = ['Lu','Ma','Me','Gi','Ve','Sa','Do'];
  let html = DNAMES.map(d => '<div class="cal-hdr">' + d + '</div>').join('');
  for (let i = 0; i < offset; i++) html += '<div class="cal-cell"></div>';

  for (let d = 1; d <= days; d++) {
    const ds      = prefix + '-' + String(d).padStart(2, '0');
    const min     = hMap[ds] || 0;
    const minPag  = hPagMap[ds] || 0;
    const hasData = min > 0 || presMap[ds];
    const cls     = ['cal-cell', 'cal-day', hasData && 'has-data', ds === t && 'today'].filter(Boolean).join(' ');
    let bar = '';
    if (min > 0) {
      const pct = Math.min(minPag / min, 1);
      bar = '<div class="cal-bar">'
          + '<div class="cal-bar-g" style="width:' + (pct * 100).toFixed(1) + '%"></div>'
          + '<div class="cal-bar-r" style="width:' + ((1 - pct) * 100).toFixed(1) + '%"></div>'
          + '</div>';
    } else if (presMap[ds]) {
      bar = '<div class="cal-bar"><div class="cal-bar-r" style="width:100%"></div></div>';
    }
    const special = ds.slice(5) === '05-11' ? '🌷' : ds.slice(5) === '06-23' ? '🪨🤍' : ds.slice(8) === '23' ? '🤍' : '';
    const cnt     = cntMap[ds] || 0;
    let oreLabel = '';
    if (min > 0) {
      oreLabel = '<span class="ch">' + fmtH(min) + (cnt > 1 ? ' <span style="color:var(--soft);font-size:9px">×' + cnt + '</span>' : '') + '</span>';
    } else if (presMap[ds]) {
      oreLabel = '<span class="ch" style="font-size:10px;color:var(--soft)">P</span>';
    }
    html += '<div class="' + cls + '" style="cursor:pointer" onclick="openDay(\'' + ds + '\')">'
          + '<span class="cn">' + d + '</span>'
          + (special ? '<span style="font-size:10px;line-height:1">' + special + '</span>' : oreLabel)
          + bar
          + '</div>';
  }

  document.getElementById('cal-grid').innerHTML = html;
}

document.getElementById('c-prev').addEventListener('click', () => {
  calM--; if (calM < 0) { calM = 11; calY--; } refreshCal();
});
document.getElementById('c-next').addEventListener('click', () => {
  calM++; if (calM > 11) { calM = 0; calY++; } refreshCal();
});

/* ── MODAL: giorno ──────────────────────────────── */
let currentDay = null;

function openDay(ds) {
  currentDay = ds;
  const d = new Date(ds + 'T12:00:00');
  document.getElementById('day-title').textContent = d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  renderDayBody(ds);
  openModal('ov-day');
}

function renderDayBody(ds) {
  const list = getRecs().filter(r => r.data === ds).sort((a, b) => a.entrata_ts - b.entrata_ts);

  const addBtn = '<button class="btn-add" onclick="addTimbratura(\'' + ds + '\')">+ Aggiungi timbratura</button>';

  if (!list.length) {
    document.getElementById('day-body').innerHTML = '<p class="empty-note">Nessuna timbratura per questo giorno.</p>' + addBtn;
    return;
  }

  const html = list.map((r, i) => {
    return '<div class="timb-card">'
      + '<div class="timb-lbl">Timbratura ' + (i + 1) + '</div>'

      + '<div class="fg"><label>Entrata</label>'
      + '<input type="time" value="' + r.entrata + '" onchange="patchRec(\'' + r.id + '\',\'entrata\',this.value)"></div>'

      + '<div class="fg"><label>Uscita</label>'
      + '<input type="time" value="' + (r.uscita || '') + '" onchange="patchRec(\'' + r.id + '\',\'uscita\',this.value)"></div>'

      + '<div class="fg"><label>Note</label>'
      + '<textarea onchange="patchRec(\'' + r.id + '\',\'nota\',this.value)">' + (r.nota || '') + '</textarea></div>'

      + '<div class="check-row">'
      + '<input type="checkbox" id="chk-' + r.id + '"' + (r.pagato ? ' checked' : '') + ' onchange="patchRec(\'' + r.id + '\',\'pagato\',this.checked)">'
      + '<label for="chk-' + r.id + '">PAGATO</label></div>'

      + (r.pagato
          ? '<div class="fg" style="margin-top:10px;"><label>Importo (€)</label>'
          + '<input type="number" step="0.01" min="0" value="' + (r.importo || 0) + '" onchange="patchRec(\'' + r.id + '\',\'importo\',parseFloat(this.value)||0)"></div>'
          : '')

      + '<button class="btn-del" onclick="delRec(\'' + r.id + '\')">Elimina timbratura</button>'
      + '</div>';
  }).join('');

  document.getElementById('day-body').innerHTML = html + addBtn;
}

function patchRec(id, field, value) {
  const all = getRecs();
  const r   = all.find(r => r.id === id);
  if (!r) return;
  r[field] = value;
  if (field === 'entrata') r.entrata_ts = hmToTs(r.data, value);
  if (field === 'uscita')  r.uscita_ts  = hmToTs(r.data, value);
  saveRecs(all);
  if (field === 'pagato') renderDayBody(currentDay); // mostra/nasconde campo importo
  refreshStats();
  refreshCal();
}

function delRec(id) {
  const all = getRecs();
  const idx = all.findIndex(r => r.id === id);
  if (idx === -1) return;
  _undoRec = { rec: all[idx], idx };
  clearTimeout(_undoTimer);
  _undoTimer = setTimeout(() => { _undoRec = null; }, 3200);
  all.splice(idx, 1);
  saveRecs(all);
  renderDayBody(currentDay);
  refreshStats();
  refreshCal();
  showToast('Eliminata &nbsp;·&nbsp; <span onclick="undoDel()" style="text-decoration:underline;cursor:pointer;color:var(--text)">ANNULLA</span>');
}

/* ── MODAL: paga ──────────────────────────────────── */
function buildPagaBody() {
  const cfg  = getSettings();
  const all  = getRecs();
  const el   = document.getElementById('paga-body');

  if (cfg.tipo === 'ore') {
    const npM = all.filter(r => !r.pagato && r.uscita_ts).reduce((a, r) => a + recMin(r) - (r.ore_pagate || 0), 0);
    const ref = npM > 0 ? '<p style="font-size:13px;color:var(--soft);margin:0 0 16px">Non pagate: <strong style="color:var(--text)">' + fmtH(npM) + '</strong></p>' : '';
    el.innerHTML = ref +
      '<div class="fg"><label>Ore pagate</label><input type="number" id="p-ore" min="0" step="0.5"></div>' +
      '<div class="fg"><label>Importo € (opz.)</label><input type="number" id="p-imp" min="0" step="0.01"></div>';
  } else {
    const lista = all.filter(r => !r.pagato).sort((a, b) => a.entrata_ts - b.entrata_ts);
    let html = '<p style="font-size:13px;color:var(--soft);margin:0 0 12px">Seleziona le giornate da pagare (vuoto = tutte dal più vecchio)</p>';
    if (!lista.length) {
      html = '<p style="color:var(--soft);font-size:13px">Nessuna giornata da pagare.</p>';
    } else {
      lista.forEach(r => {
        const min = recMin(r);
        const imp = calcolaImporto(min);
        const oreTxt = r.uscita ? r.entrata + '–' + r.uscita + ' · ' + fmtH(min) : (r.entrata || '') + ' · presenza';
        html += '<label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer">' +
          '<input type="checkbox" class="paga-chk" data-id="' + r.id + '">' +
          '<span style="flex:1"><span style="font-weight:600">' + fmtDataIt(r.data) + '</span>' +
          ' &nbsp; <span style="color:var(--soft)">' + oreTxt + '</span></span>' +
          '<span style="color:var(--soft);font-size:13px">€ ' + imp.toFixed(2) + '</span>' +
          '</label>';
      });
    }
    el.innerHTML = html;
  }
}

document.getElementById('btn-paga').addEventListener('click', () => {
  buildPagaBody();
  openModal('ov-paga');
});

document.getElementById('btn-salva-paga').addEventListener('click', () => {
  const cfg = getSettings();
  const all = getRecs();

  if (cfg.tipo === 'ore') {
    const oreIn   = parseFloat(document.getElementById('p-ore').value) || 0;
    const importo = parseFloat(document.getElementById('p-imp').value) || 0;
    if (!oreIn) { showToast('Inserisci le ore pagate', 'err'); return; }
    let minRimasti = Math.round(oreIn * 60);
    const candidati = all.filter(r => !r.pagato && r.uscita_ts).sort((a, b) => a.entrata_ts - b.entrata_ts);
    const minTot = Math.min(minRimasti, candidati.reduce((a, r) => a + recMin(r) - (r.ore_pagate || 0), 0));
    for (const r of candidati) {
      if (minRimasti <= 0) break;
      const minDisp = recMin(r) - (r.ore_pagate || 0);
      const quota   = minTot > 0 ? (Math.min(minDisp, minRimasti) / minTot) * importo : 0;
      if (minRimasti >= minDisp) {
        r.pagato = true; r.importo = Math.round(quota * 100) / 100; delete r.ore_pagate; minRimasti -= minDisp;
      } else {
        r.ore_pagate = (r.ore_pagate || 0) + minRimasti; r.importo = Math.round(quota * 100) / 100; minRimasti = 0;
      }
    }
  } else {
    const chks = [...document.querySelectorAll('.paga-chk:checked')];
    if (chks.length) {
      const ids = new Set(chks.map(c => c.dataset.id));
      for (const r of all.filter(r => ids.has(r.id))) {
        r.pagato  = true;
        r.importo = calcolaImporto(recMin(r));
      }
    } else {
      const nonPagate = all.filter(r => !r.pagato).sort((a, b) => a.entrata_ts - b.entrata_ts);
      if (!nonPagate.length) { closeModal('ov-paga'); return; }
      showConfirm('Segna come pagate tutte le ' + nonPagate.length + ' giornate non pagate?', () => {
        for (const r of nonPagate) { r.pagato = true; r.importo = calcolaImporto(recMin(r)); }
        saveRecs(all);
        closeModal('ov-paga');
        refreshStats();
        refreshCal();
        showToast(nonPagate.length + ' giornate segnate come pagate', 'ok');
      });
      return;
    }
  }

  saveRecs(all);
  closeModal('ov-paga');
  refreshStats();
  refreshCal();
  showToast('Pagamento applicato', 'ok');
});


/* ── DIARIO ─────────────────────────────────────── */
const DIARY_KEY   = 'pr_diary';
const DEXPORT_KEY = 'pr_diary_export';

function getDiary()      { return JSON.parse(localStorage.getItem(DIARY_KEY)   || '{}'); }
function saveDiary(d)    { localStorage.setItem(DIARY_KEY, JSON.stringify(d)); }


function checkDiaryBanner() {
  const diary   = getDiary();
  const hasData = Object.keys(diary).some(k => diary[k].trim());
  if (!hasData) { document.getElementById('diary-banner').style.display = 'none'; return; }
  const lastExp = parseInt(localStorage.getItem(DEXPORT_KEY) || '0');
  const days    = Math.floor((Date.now() - lastExp) / 86400000);
  const banner  = document.getElementById('diary-banner');
  if (!lastExp || days >= 7) {
    document.getElementById('diary-banner-txt').textContent =
      lastExp ? 'Backup consigliato — ultimo ' + days + ' giorni fa' : 'Nessun backup ancora — esporta il diario';
    banner.style.display = 'flex';
  } else {
    banner.style.display = 'none';
  }
}

function refreshDiaryList() {
  const diary = getDiary();
  const keys  = Object.keys(diary).filter(k => diary[k].trim()).sort().reverse();
  const el    = document.getElementById('diary-list');
  if (!keys.length) {
    el.innerHTML = '<div class="diary-empty">Nessuna nota ancora</div>';
    return;
  }
  el.innerHTML = keys.map(k => {
    const d = new Date(k + 'T12:00:00');
    const dateStr = d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    const firstLine = diary[k].trim().split('\n')[0].slice(0, 80);
    return '<div class="diary-item" onclick="openDiaryDay(\'' + k + '\')">'
         + '<span class="diary-item-date">' + dateStr + '</span>'
         + '<span class="diary-item-preview">' + firstLine + '</span>'
         + '</div>';
  }).join('');
}

function openDiaryDay(ds) {
  const d = new Date(ds + 'T12:00:00');
  document.getElementById('diary-day-title').textContent = d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  document.getElementById('diary-nota').value = getDiary()[ds] || '';
  document.getElementById('btn-salva-diary-day').onclick = () => {
    const val = document.getElementById('diary-nota').value;
    const diary = getDiary();
    if (val.trim()) diary[ds] = val; else delete diary[ds];
    saveDiary(diary);
    closeModal('ov-diary-day');
    refreshDiaryList();
    showToast(val.trim() ? 'Nota salvata' : 'Nota eliminata', 'ok');
  };
  openModal('ov-diary-day');
}

function withXLSX(cb) {
  if (window.XLSX) { cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js';
  s.onload = cb;
  s.onerror = () => showToast('Impossibile caricare la libreria Excel', 'err');
  document.head.appendChild(s);
}

function exportAll() {
  withXLSX(() => {
  const all   = getRecs();
  const diary = getDiary();
  const wb    = XLSX.utils.book_new();

  // Foglio 1: Presenze
  const presRows = [...all]
    .sort((a, b) => a.data.localeCompare(b.data))
    .map(r => {
      const min = recMin(r);
      const h = Math.floor(min / 60), m = Math.round(min % 60);
      return {
        'Data':           r.data,
        'Entrata':        r.entrata || '',
        'Uscita':         r.uscita  || '',
        'Ore':            min ? h + ':' + String(m).padStart(2,'0') : '',
        'Ore (decimali)': min ? +(min / 60).toFixed(2) : '',
        'Nota':           r.nota    || '',
        'Pagato':         r.pagato  ? 'Sì' : 'No',
        'Importo €':      r.importo || ''
      };
    });
  const ws1 = XLSX.utils.json_to_sheet(presRows.length ? presRows : [{ 'Info': 'Nessuna presenza' }]);
  ws1['!cols'] = [12, 8, 8, 8, 14, 22, 8, 10].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws1, 'Presenze');

  // Foglio 2: Diario
  const diaryKeys  = Object.keys(diary).filter(k => diary[k].trim()).sort();
  const diaryRows  = diaryKeys.map(k => ({ 'Data': k, 'Note': diary[k] }));
  const ws2 = XLSX.utils.json_to_sheet(diaryRows.length ? diaryRows : [{ 'Info': 'Nessuna nota' }]);
  ws2['!cols'] = [{ wch: 12 }, { wch: 80 }];
  XLSX.utils.book_append_sheet(wb, ws2, 'Diario');

  XLSX.writeFile(wb, 'backup_' + todayStr() + '.xlsx');
  localStorage.setItem(DEXPORT_KEY, Date.now().toString());
  checkDiaryBanner();
  showToast('Backup esportato', 'ok');
  });
}

document.getElementById('btn-diary-export').addEventListener('click', exportAll);
document.getElementById('btn-export').addEventListener('click', exportAll);

/* ── Aggiungi timbratura manuale ────────────────── */
function addTimbratura(ds) {
  const body = document.getElementById('day-body');
  // sostituisce il bottone + con il form inline
  const form = body.querySelector('.timb-form');
  if (form) return; // già aperto
  const div = document.createElement('div');
  div.className = 'timb-form';
  div.innerHTML =
    '<div class="fg"><label>Entrata</label><input type="time" id="tf-in"></div>'
  + '<div class="fg"><label>Uscita</label><input type="time" id="tf-out"></div>'
  + '<button class="btn-cta" onclick="confirmTimbratura(\'' + ds + '\')">Conferma</button>'
  + '<button class="btn-del" onclick="renderDayBody(\'' + ds + '\')">Annulla</button>';
  body.querySelector('.btn-add').replaceWith(div);
}

function confirmTimbratura(ds) {
  const entrata = document.getElementById('tf-in').value;
  const uscita  = document.getElementById('tf-out').value;
  if (!entrata) { showToast('Inserisci almeno l\'orario di entrata', 'err'); return; }
  const all = getRecs();
  all.push({
    id: uid(), data: ds,
    entrata, uscita,
    entrata_ts: hmToTs(ds, entrata),
    uscita_ts:  uscita ? hmToTs(ds, uscita) : 0,
    sito: '', nota: '', pagato: false, importo: 0
  });
  saveRecs(all);
  renderDayBody(ds);
  refreshStats();
  refreshCal();
}


/* ── showToast + showConfirm ────────────────────── */
function showToast(html, type) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.innerHTML = html;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3300);
}
function showConfirm(msg, onYes) {
  document.getElementById('confirm-msg').textContent = msg;
  document.getElementById('confirm-yes').onclick = () => { closeModal('ov-confirm'); onYes(); };
  document.getElementById('confirm-no').onclick  = () => closeModal('ov-confirm');
  openModal('ov-confirm');
}

/* ── Init ───────────────────────────────────────── */
refreshHome();
refreshStats();
refreshCal();
setTimeout(() => document.getElementById('splash').remove(), 2500);
</script>
